#!/bin/bash
# ============================================================================
# ALL CONFIG FILES IN THIS DIRECTORY USE THE .conf EXTENSION BY PROJECT
# CONVENTION, EVEN THOUGH THEY ARE PLAIN BASH FILES THAT BASH SOURCES
# DIRECTLY. THE EXTENSION IS COSMETIC — BASH IGNORES IT ENTIRELY. DO NOT
# RENAME TO .sh; EDITORS MAY NOT AUTO-HIGHLIGHT AS BASH, BUT EXECUTION IS
# UNAFFECTED.
# ============================================================================
# Shared Configuration for All SLURM Scripts
# ============================================================================
# Source this at the top of every job script AND from the login-node
# orchestrator (submit_pipeline.sh).
#
# Provides:
#   - Environment variables (TRANSFORMERS_NO_TF)
#   - Python interpreter path
#   - Project directory paths (WORK_DIR, BASE_DIR, DATA_DIR, CACHE_DIR)
#   - Key data file paths (ESM_PATH, GO_PATH, SL_PATH, etc.)
#   - Shared training hyperparameters (architecture, optimiser, regularization)
#   - Cross-validation types (CV_TYPES)
#   - Embedding catalog (ALL_EMBEDDINGS)
#   - Compute-node setup (module loads, cd, GPU info) — only inside SLURM jobs
#
# Per-job .conf files hold job-specific settings only:
#   - run_generate_embeddings.conf  (PRECOMPUTED_TYPES)
#   - run_embedding_benchmark.conf  (overrides, if any)
#   - run_best_per_category.conf    (PCA_VARIANCE, EMB_CATALOG)
#   - eval_finetuning.conf          (external-data evaluation / fine-tuning)
#
# Usage:
#   # Inside a SLURM job script:
#   source "$SLURM_SUBMIT_DIR/slurm/config.conf"
#
#   # From the login node (submit_pipeline.sh):
#   source "$(dirname "$0")/config.conf"
# ============================================================================

# Prevent transformers from importing TensorFlow (numpy binary incompatibility)
export TRANSFORMERS_NO_TF=1

# Python environment
# Type: string (absolute path to python3 binary)
PYTHON_PATH="/ddn_exa/campbell/kaiyang/pytorch/bin/python3"

# ============================================================================
# Project directories
# ============================================================================
# Works both inside SLURM jobs (SLURM_SUBMIT_DIR is set by sbatch to the
# directory where the command was run) and from the login node (fall back
# to deriving from this file's location: slurm/config.conf → siamese_sl/).

WORK_DIR="${SLURM_SUBMIT_DIR:-$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)}"
BASE_DIR="$(dirname "$WORK_DIR")"          # SLMGAE-pytorch/
DATA_DIR="$BASE_DIR/data"                  # Final .pt embedding files
CACHE_DIR="$DATA_DIR/embeddings_cache"     # Downloaded raw data (STRING PPI, GO, model weights, etc.)

# ============================================================================
# Key data files
# ============================================================================
# Type: string (absolute paths, derived from directories above)

ESM_PATH="$DATA_DIR/all_genes_esm2.pt"              # ESM-2 embeddings; also canonical gene list
GO_PATH="$DATA_DIR/all_genes_go.pt"                 # GO anc2vec embeddings (200d)
GAF_PATH="$CACHE_DIR/goa_human.gaf.gz"              # Gene Ontology annotation file (GAF 2.2); auto-downloaded by generate_embeddings.py
SL_PATH="$DATA_DIR/SL_SynLethDB_experimental.txt"   # SynLethDB experimental SL pairs (v3 portal == v2 export)

# Canonical gene universe for ALL embeddings (one Entrez ID per line).
# Built by run_generate_embeddings.sh STEP 0b as positives UNION negatives.
#
# WHY THIS EXISTS: embeddings used to be seeded from SL_PATH alone, so
# gene_order was exactly the 5,257 genes appearing in >=1 POSITIVE pair. The
# 3,587 genes that appear only in negatives then had no embedding at all —
# they were mean-filled into a single shared vector, making "has no embedding"
# a perfect predictor of "not SL", and forcing siamese onto a different pair
# universe (and hence a different test set and baseline) than the shared folds.
#
# To widen further (e.g. all ~20k protein-coding genes, so any pair is
# scoreable at inference), point this at a different one-ID-per-line file —
# generate_all_genes_esm.py:809-817 parses that format directly. Regenerating
# is the expensive step, so decide the width BEFORE running.
GENE_UNIVERSE="$DATA_DIR/gene_universe.txt"

# Experimentally screened NON-SL pairs (SynLethDB v3 "Human.non.SL"), usable as
# real negatives instead of random non-edge sampling. NEG_PATH_FILE is the
# generated file (always produced by run_generate_embeddings.sh STEP 0).
# NEG_PATH is the toggle threaded into train.py:
#   ""            -> random negatives (original benchmark behavior, default)
#   $NEG_PATH_FILE -> train/eval against experimental negatives
# POS_NEG_RATIO still controls class balance in either mode.
NEG_PATH_FILE="$DATA_DIR/SL_SynLethDB_experimental_negatives.txt"
NEG_PATH="$NEG_PATH_FILE"   # experimental negatives (SynLethDB v3 Human.non.SL); "" = random

# --- Cell-line conditioning (masked multi-label, concat-at-input) -----------
# When enabled, train.py treats each gene pair as one example carrying a
# per-head (label, mask) over the cell-line heads
# [K562, JURKAT, A549, HELA, A375, 293T, PC9, OTHER] (read from the
# ".sources.tsv" sidecars next to SL_PATH / NEG_PATH). A cell embedding is
# concatenated onto the gene features and the model predicts SL per head;
# only known (pair, head) cells are supervised (masked BCE, per-head
# pos_weight). REQUIRES NEG_PATH (the screened non-SL pairs are the per-head
# negatives) and the ".sources.tsv" sidecars next to SL_PATH / NEG_PATH. This
# redefines the prediction unit and the selection metric (stratified pooled
# AUPRG; raw AUPR in single-output mode), so every benchmark result reports
# per-cell-line performance. ON by default now; set
# USE_CELL_LINES=0 (env or here) to fall back to the single-output SL benchmark.
# Cell-trained checkpoints are multi-head (SiameseSLMultiCell); the Stage-4
# external-screen eval consumes them PER cell-line head (PER_HEAD, auto-enabled
# in eval_finetuning.conf when USE_CELL_LINES=1).
USE_CELL_LINES="${USE_CELL_LINES:-1}"   # 1 = enable cell-line conditioning (default)
CELL_LINE_DIM="${CELL_LINE_DIM:-24}"    # cell-line embedding dim (concat at input)
if [ "$USE_CELL_LINES" = "1" ]; then
    CELL_LINE_ARGS="--use_cell_lines --cell_line_dim $CELL_LINE_DIM"
else
    CELL_LINE_ARGS=""
fi

# ----------------------------------------------------------------------------
# Shared canonical CV folds (the four-model fairness path)
# ----------------------------------------------------------------------------
# When set, train.py takes its train/val/test PARTITION from
# sl_comparison/folds instead of building its own gene-disjoint split. Three
# things follow, and all three are required for the comparison to mean anything:
#   1. siamese is trained and scored on the SAME pairs as SLMGAE/SLGNN/NSF4SL,
#      so `baseline` is identical by construction rather than merely close
#      (0.1593 vs 0.1348 in the Aug 2 run came entirely from this).
#   2. checkpoint selection moves onto the shared VAL split, so the reported
#      test metrics are not also the selection criterion.
#   3. each fold writes fold_<k>_<cv>_predictions.npy in shared gene order, so
#      sl_comparison/evaluate_model.py grades siamese with the SAME cal_metrics
#      pass as the peers — which also makes ndcg@k/recall@k comparable (every
#      model ranks against the same 8,844 candidates, not siamese's ~19.4k).
# Requires USE_CELL_LINES=1. Set empty to restore siamese's own folds.
SHARED_FOLDS="${SHARED_FOLDS:-../sl_comparison/folds}"
if [ "$USE_CELL_LINES" = "1" ] && [ -n "$SHARED_FOLDS" ]; then
    CELL_LINE_ARGS="$CELL_LINE_ARGS --folds_dir $SHARED_FOLDS"
fi

# ============================================================================
# Shared training hyperparameters
# ============================================================================
# Used by both the embedding benchmark and best-per-category pipelines.
# Per-job .conf files can override any of these for independent tuning.

# --- Architecture ---
# Residual encoder with 7 linear layers:
#   entry lift:       Linear(input_dim → 6) + LN + LReLU + Drop    # no skip
#   residual blocks:  5 × [Linear(6→6) + LN + LReLU + Drop] with y = x + F(x)
#   projection:       Linear(6 → 6)                                # latent 6
# The residual skips (same-width hidden blocks) keep gradient flow through
# the deeper stack — plain narrow deep MLPs without skips hit rank-collapse
# / gradient-pathway issues (Pennington 2017; Hanin & Rolnick 2019).
# Extreme-capacity floor: the entry lift compresses ~25× (D≈150→6), which
# tests whether the residual stack + L1 still carries enough signal for CV3.
# See SIAMESE_ENCODER_TYPE below to switch back to the plain MLP variant.
ENCODER_DIMS="16 16 16 16 16 16 16"
MODEL_ARGS="--model_type siamese --no-last-layer-bias"

# --- Siamese encoder variant ---
# "residual" (default): same-width hidden blocks get y = x + F(x) skip
#            connections — cleaner gradient flow, enables deeper stacks.
# "mlp":     plain stack of Linear→LN→LReLU→Dropout blocks (no skips).
# Overridable via env var. ENCODER_DIMS above is tuned for the residual
# variant (first layer is the entry lift, middle layers are same-width
# for skips); if switching to "mlp", also widen/reshape ENCODER_DIMS and
# adjust L1_LAMBDAS accordingly.
SIAMESE_ENCODER_TYPE="${SIAMESE_ENCODER_TYPE:-residual}"

# --- Training ---
EPOCHS=2000
BATCH_SIZE=256
LR=0.001
WEIGHT_DECAY=0.00001
DROPOUT=0.2
EVAL_INTERVAL=30
PATIENCE=10
NUM_FOLDS=5
POS_NEG_RATIO=1.0
SEED="${SEED:-42}"   # honor an exported SEED (e.g. from the root benchmark orchestrator); default 42
WARMRESTART_T0=50
WARMRESTART_TMULT=2

# --- Regularization ---
# L1_LAMBDAS: per-layer proximal L1 (ONE value per weight matrix; the count
# must equal len(ENCODER_DIMS) since every entry in ENCODER_DIMS creates one
# Linear layer — entry + residual blocks + projection).
# Decreasing pattern — early layers see raw concatenated features and benefit
# from aggressive sparsification; later layers are already compressed.
# Halved from the width-24 schedule (0.02, ...) when the entry lift was width 6
# (~900 weights at D≈150) and the prior schedule would over-prune. ENCODER_DIMS
# is width 16 now, and the post-concat PCA is back on a VARIANCE target, so the
# combo's entry layer is Linear(k+24 -> 16) for whatever k the 80% threshold
# resolves to — k≈1087 at PCA_METHOD=plain, i.e. ~17.8k weights rather than the
# ~2.7k these lambdas were last reasoned about. They are inherited, not derived,
# and are NOT retuned for this width; worse, k drifts with the combo's modality
# selection, so the same lambda prunes a different-sized layer from run to run.
# If the sparsity pattern looks wrong, retune here or pin POST_PCA_DIM.
L1_LAMBDAS="0.01 0.0075 0.005 0.004 0.0025 0.0015 0.001"
# PD_EPSILON: positive-definiteness regularizer (0 to disable)
PD_EPSILON=0.001

# --- Post-concat PCA (combo script only) ---
# Second PCA pass on the normalized, concatenated matrix, so the encoder's
# first layer sees a bounded input even when the combo concatenates to 4,000+d.
# Applies to run_best_per_category_combo.sh (multi-modal) only; the
# single-modality script passes --no_post_pca (native dim).
#
# A VARIANCE FRACTION, NOT AN EXACT COUNT (reverted 2026-08-24 by request).
# The combo keeps the smallest number of components reaching POST_PCA_VARIANCE
# of the spectrum, so the retained width is whatever 80% of the variance costs
# for the modality set the first pass happened to select.
#
# Know what this means before changing PCA_METHOD. A variance target does NOT
# mean the same thing across methods: `robust`/`svd` resolve k on the raw
# covariance spectrum, while `plain` resolves it on the per-column-standardized
# (correlation) spectrum, which is far flatter because standardizing gives
# every dimension equal variance. Measured through fit_multimodal_transform on
# the modality set the 2026-08-11 cv1 run actually selected
# (geneformer+go2vec+kg_complex+ppi_raw+prot_t5+text_embed, 4,864d concat,
# 19,397 genes, 80% fit rows):
#     svd   @ 0.80  ->  k =  458
#     plain @ 0.80  ->  k = 1534      <- the CURRENT setting
# and on a different 6-modality set (esm2/text_embed/ppi_svd/go/kg_complex/
# geneformer, 4,424d concat), the same 0.80 target gave svd 145 / plain 1087.
# Neither k is "wrong" — they answer the same question about different
# matrices. Two consequences to expect:
#   1. At PCA_METHOD=plain the combo's entry layer is Linear(1534+24 -> 16),
#      ~25k weights, against ~2.7k at the old pinned 145. The reported
#      parameter count grows by roughly an order of magnitude, and L1_LAMBDAS
#      above is NOT tuned for that width.
#   2. The width is not stable run to run. best-per-category picks the combo's
#      modalities dynamically, so the concat dim and spectrum shape move and k
#      moves with them — 1534 here, 1087 on the other set above, for one
#      unchanged 0.80 target.
# train.py logs the resolved count ("Variance target 80% on the correlation
# spectrum: k components") — read it from the job log, never assume a value.
#
# Set POST_PCA_DIM to an integer to pin an exact count instead (it wins over
# POST_PCA_VARIANCE); set both empty to disable the post-concat PCA entirely.
POST_PCA_DIM="${POST_PCA_DIM:-}"
POST_PCA_VARIANCE="${POST_PCA_VARIANCE:-0.8}"

# --- Preprocessing fit scope ---
# Controls which gene rows fit Huber-impute + ROBPCA + median/MAD, PER FOLD.
#   "train" (default, leak-free): only training-pair genes + non-SL genes.
#   "all"  (legacy, leaky):       every gene, regardless of fold.
# Use "all" only for A/B comparison to quantify the effect of the per-fold
# fit over the old shared-all-gene fit. Threaded into every train.py call
# in the benchmark + best-per-category + combo SLURM scripts.
# Overridable via env var (e.g., `PREPROCESSING_FIT_SCOPE=all sbatch ...`).
PREPROCESSING_FIT_SCOPE="${PREPROCESSING_FIT_SCOPE:-train}"

# --- PCA method ---
# Selects the ENTIRE preprocessing pipeline (not just PCA itself).
#   "plain" (default): mean-impute → per-column mean+std standardize → SVD →
#       global mean/std normalize. All classical measures.
#   "robust": Huber-impute → ROBPCA (with median-centered-SVD fallback) →
#       global median/MAD normalize. All robust measures.
#   "svd": matrix-wise global-scalar normalize → median-centered SVD; no
#       per-column standardize, no ROBPCA.
# "plain" is the default as of 2026-08-10: one classical pipeline everywhere,
# so no result depends on which of three preprocessing regimes a given job
# happened to inherit. "robust"/"svd" remain available to reproduce earlier
# runs or to A/B the outlier filtering.
# Overridable via env var (e.g., `PCA_METHOD=robust sbatch ...`).
PCA_METHOD="${PCA_METHOD:-plain}"

# --- Cross-validation types ---
# cv1: edge split, cv2: gene split, cv3: pair split (hardest)
CV_TYPES=("cv1" "cv2" "cv3")

# ============================================================================
# Embedding catalog
# ============================================================================
# ALL_EMBEDDINGS: complete list (type:filename:display_name)
# Used by generation summary, embedding benchmark, and submit_pipeline.sh.
ALL_EMBEDDINGS=(
    "go:all_genes_go.pt:GO-anc2vec (200d)"
    "geneformer:all_genes_geneformer.pt:Geneformer (auto)"
    "scgpt:all_genes_scgpt.pt:scGPT (512d)"
    "gene2vec:all_genes_gene2vec.pt:Gene2Vec (200d)"
    "esm2:all_genes_esm2.pt:ESM-2 (1280d)"
    "prot_t5:all_genes_prot_t5.pt:ProtT5-XL (1024d)"
    "esm1b:all_genes_esm1b.pt:ESM-1b (1280d)"
    "esmc:all_genes_esmc.pt:ESM-C (1152d)"
    "scprint:all_genes_scprint.pt:scPRINT (auto)"
    "seqvec:all_genes_seqvec.pt:SeqVec (1024d)"
    "genept:all_genes_genept.pt:GenePT (1536d, SL data leakage)"
    "text_embed:all_genes_text_embed.pt:Text-mxbai (1024d)"
    "bioconceptvec:all_genes_bioconceptvec.pt:BioConceptVec (100d)"
    "node2vec_ppi:all_genes_node2vec_ppi.pt:Node2Vec PPI (128d)"
    "ppi_svd:all_genes_ppi_svd.pt:PPI-SVD (256d)"
    "ppi_raw:all_genes_ppi_raw.pt:PPI-RAW (1024d)"
    "mashup:all_genes_mashup.pt:Mashup (500d)"
    "go2vec:all_genes_go2vec.pt:GO2Vec (128d)"
    "onto2vec:all_genes_onto2vec.pt:Onto2Vec (128d)"
    "kg_complex:all_genes_kg_complex.pt:KG-ComplEx (512d)"
)

# ============================================================================
# Compute-node setup (only inside SLURM jobs)
# ============================================================================
# Skipped when sourced from the login node (submit_pipeline.sh), where
# SLURM_JOB_ID is not set. This avoids module-load and nvidia-smi errors.

if [ -n "$SLURM_JOB_ID" ]; then
    module purge
    module load gnu15 openmpi5 EasyBuild cmake openblas fftw

    cd "$WORK_DIR"

    echo "============================================================================"
    echo "Job: $SLURM_JOB_NAME | ID: $SLURM_JOB_ID | Node: ${SLURM_NODELIST:-$(hostname)}"
    if [ -n "$SLURM_ARRAY_TASK_ID" ]; then
        echo "Array task: $SLURM_ARRAY_TASK_ID (of job $SLURM_ARRAY_JOB_ID)"
    fi
    echo "Start: $(date)"
    nvidia-smi --query-gpu=name,memory.total,memory.used --format=csv,noheader 2>/dev/null || true
    echo "============================================================================"
    echo ""
fi
