#!/bin/bash
# ============================================================================
# ALL CONFIG FILES IN THIS DIRECTORY USE THE .conf EXTENSION BY PROJECT
# CONVENTION, EVEN THOUGH THEY ARE PLAIN BASH FILES THAT BASH SOURCES
# DIRECTLY. THE EXTENSION IS COSMETIC — BASH IGNORES IT ENTIRELY. DO NOT
# RENAME TO .sh; EDITORS MAY NOT AUTO-HIGHLIGHT AS BASH, BUT EXECUTION IS
# UNAFFECTED.
# ============================================================================
# Shared Configuration for All SLURM Scripts
# ============================================================================
# Source this at the top of every job script AND from the login-node
# orchestrator (submit_pipeline.sh).
#
# Provides:
#   - Environment variables (TRANSFORMERS_NO_TF)
#   - Python interpreter path
#   - Project directory paths (WORK_DIR, BASE_DIR, DATA_DIR, CACHE_DIR)
#   - Key data file paths (ESM_PATH, GO_PATH, SL_PATH, etc.)
#   - Shared training hyperparameters (architecture, optimiser, regularization)
#   - Model variants (SIAMESE_VARIANTS array, built from and re-exported as the
#     scalar SIAMESE_VARIANTS_LIST; SELECTION_VARIANT, ARCH_ARGS) and the
#     siamese_variant_{args,tag,prefix} helpers
#   - The modality-selection split and mode (SELECTION_FRAC, SELECTION_SEED,
#     SELECTION_MODE, exported; SELECTION_ARGS, the train.py flags)
#   - PCA arms (PCA_ARMS, PCA_ARM and the PCA_* targets, exported; the pca_*
#     helpers, pca_check_combos among them; this job's arm as RESULTS_ROOT /
#     STEP1_ROOT / CMP_ROOT and PCA_MULTI_ARGS / PCA_SINGLE_ARGS, not exported)
#   - pasted_env_def: the first line of the command blocks the orchestrators
#     print to paste
#   - RUN_TOKEN (exported): the id of one pipeline submission
#   - Cross-validation types (CV_TYPES)
#   - Embedding catalog (ALL_EMBEDDINGS)
#   - Compute-node setup (module loads, cd, GPU info) — only inside SLURM jobs
#
# Per-job .conf files hold job-specific settings only:
#   - run_generate_embeddings.conf  (PRECOMPUTED_TYPES, OPTIONAL_TYPES)
#   - run_embedding_benchmark.conf  (overrides, if any)
#   - run_best_per_category.conf    (PCA_VARIANCE, EMB_CATALOG)
#   - eval_finetuning.conf          (external-data evaluation / fine-tuning)
#   - export_pair_predictions.conf  (all-gene-pair export, PAIR_EXPORT_*)
#
# Usage:
#   # Inside a SLURM job script:
#   source "$SLURM_SUBMIT_DIR/slurm/config.conf"
#
#   # From the login node (submit_pipeline.sh):
#   source "$(dirname "$0")/config.conf"
# ============================================================================

# Prevent transformers from importing TensorFlow (numpy binary incompatibility)
export TRANSFORMERS_NO_TF=1

# Python environment
# Type: string (absolute path to python3 binary)
PYTHON_PATH="<home>/pytorch/bin/python3"

# ============================================================================
# Project directories
# ============================================================================
# Works both inside SLURM jobs (SLURM_SUBMIT_DIR is set by sbatch to the
# directory where the command was run) and from the login node (fall back
# to deriving from this file's location: slurm/config.conf → siamese_sl/).

WORK_DIR="${SLURM_SUBMIT_DIR:-$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)}"
BASE_DIR="$(dirname "$WORK_DIR")"          # SLMGAE-pytorch/
DATA_DIR="$BASE_DIR/data"                  # Final .pt embedding files
CACHE_DIR="$DATA_DIR/embeddings_cache"     # Downloaded raw data (STRING PPI, GO, model weights, etc.)

# ============================================================================
# Key data files
# ============================================================================
# Type: string (absolute paths, derived from directories above)

ESM_PATH="$DATA_DIR/all_genes_esm2.pt"              # ESM-2 embeddings; also canonical gene list
GO_PATH="$DATA_DIR/all_genes_go.pt"                 # GO anc2vec embeddings (200d)
GAF_PATH="$CACHE_DIR/goa_human.gaf.gz"              # Gene Ontology annotation file (GAF 2.2); auto-downloaded by generate_embeddings.py
SL_PATH="$DATA_DIR/SL_SynLethDB_experimental.txt"   # SynLethDB experimental SL pairs (v3 portal == v2 export)

# Canonical gene universe for ALL embeddings (one Entrez ID per line).
# Built by run_generate_embeddings.sh STEP 0b as HGNC protein-coding genes
# UNION every gene in a positive or negative pair (19,397 genes on the current
# files; the 8,844 pair genes are all included). STEP 0b REWRITES this file on
# every generation run.
#
# WHY THIS EXISTS: embeddings used to be seeded from SL_PATH alone, so
# gene_order was exactly the 5,257 genes appearing in >=1 POSITIVE pair. The
# 3,587 genes that appear only in negatives then had no embedding at all —
# they were mean-filled into a single shared vector, making "has no embedding"
# a perfect predictor of "not SL", and forcing siamese onto a different pair
# universe (and hence a different test set and baseline) than the shared folds.
#
# It already covers all ~19k protein-coding genes, so any protein-coding pair
# is scoreable at inference. To change the universe, edit STEP 0b in
# run_generate_embeddings.sh: pointing this variable at another list does NOT
# work, because STEP 0b overwrites whatever file it names (and the root
# run_benchmarking_siamese_vs_others.sh checks embedding staleness against
# data/gene_universe.txt directly). Regenerating is the expensive step, so
# decide the width BEFORE running.
GENE_UNIVERSE="$DATA_DIR/gene_universe.txt"

# Experimentally screened NON-SL pairs (SynLethDB v3 "Human.non.SL"), the real
# negatives. NEG_PATH_FILE is the generated file (always produced by
# run_generate_embeddings.sh STEP 0). NEG_PATH is what train.py receives
# (--neg_pairs_path):
#   USE_CELL_LINES=1 (default): REQUIRED. The screened non-SL pairs are the
#       per-head negatives; with NEG_PATH="" train.py raises (data_loader).
#   USE_CELL_LINES=0: ignored. The single-output model takes its pos/neg labels
#       from the shared folds (SHARED_FOLDS below).
# There is no random-negative mode: train.py requires the shared folds, and
# the random/own-split negative sampling is unreachable with them. For the same
# reason POS_NEG_RATIO (below) has no effect: the shared folds fix the class
# balance (all screened negatives: 22,166 positives vs 106,704 negatives,
# about 1:4.8).
NEG_PATH_FILE="$DATA_DIR/SL_SynLethDB_experimental_negatives.txt"
NEG_PATH="$NEG_PATH_FILE"   # required when USE_CELL_LINES=1; ignored with USE_CELL_LINES=0

# --- Cell-line conditioning (masked multi-label, concat-at-input) -----------
# When enabled, train.py treats each gene pair as one example carrying a
# per-head (label, mask) over the cell-line heads
# [K562, JURKAT, A549, HELA, A375, 293T, PC9, OTHER] (read from the
# ".sources.tsv" sidecars next to SL_PATH / NEG_PATH). A cell embedding is
# concatenated onto the gene features and the model predicts SL per head;
# only known (pair, head) cells are supervised (masked-mean BCE; no
# pos_weight, by design: the masked mean is the only weighting). REQUIRES
# NEG_PATH (the screened non-SL pairs are the per-head negatives) and the
# ".sources.tsv" sidecars next to SL_PATH / NEG_PATH. This
# redefines the prediction unit and the selection metric (validation AUPRG of
# the OR label, auprg_any, by default — train.py --select_metric), so every
# benchmark result reports per-cell-line performance. ON by default.
# USE_CELL_LINES=0 trains the single-output SiameseSL instead, on the shared
# folds' own labels (SHARED_FOLDS below is required either way: train.py
# selects on the validation split only, and only the shared folds carry one).
# Cell-trained checkpoints are multi-head (SiameseSLMultiCell); the Stage-4
# external-screen eval consumes them PER cell-line head (PER_HEAD, auto-enabled
# in eval_finetuning.conf when USE_CELL_LINES=1).
USE_CELL_LINES="${USE_CELL_LINES:-1}"   # 1 = enable cell-line conditioning (default)
CELL_LINE_DIM="${CELL_LINE_DIM:-24}"    # cell-line embedding dim (concat at input)
if [ "$USE_CELL_LINES" = "1" ]; then
    CELL_LINE_ARGS="--use_cell_lines --cell_line_dim $CELL_LINE_DIM"
else
    CELL_LINE_ARGS=""
fi

# ----------------------------------------------------------------------------
# Shared canonical CV folds (the four-model fairness path)
# ----------------------------------------------------------------------------
# When set, train.py takes its train/val/test PARTITION from
# sl_comparison/folds instead of building its own gene-disjoint split. Three
# things follow, and all three are required for the comparison to mean anything:
#   1. siamese is trained and scored on the SAME pairs as SLMGAE/SLGNN/NSF4SL,
#      so `baseline` is identical by construction rather than merely close
#      (0.1593 vs 0.1348 in the Aug 2 run came entirely from this).
#   2. checkpoint selection moves onto the shared VAL split, so the reported
#      test metrics are not also the selection criterion.
#   3. each fold writes fold_<k>_<cv>_predictions.npy in shared gene order, so
#      sl_comparison/evaluate_model.py grades siamese with the SAME cal_metrics
#      pass as the peers — which also makes ndcg@k/recall@k comparable (every
#      model ranks against the same 8,844 candidates, not siamese's ~19.4k).
# Training requires the shared folds in both modes: train.py early-stops and
# selects checkpoints on the VALIDATION split only and exits without one.
# Siamese's own folds carry no val split, so emptying SHARED_FOLDS makes every
# siamese train.py run exit. With USE_CELL_LINES=0 the labels are the folds'
# own pos/neg (NEG_PATH is then not used).
SHARED_FOLDS="${SHARED_FOLDS:-../sl_comparison/folds}"
if [ -n "$SHARED_FOLDS" ]; then
    CELL_LINE_ARGS="${CELL_LINE_ARGS:+$CELL_LINE_ARGS }--folds_dir $SHARED_FOLDS"
else
    echo "WARNING: SHARED_FOLDS is empty: train.py is val-only and needs" \
         "--folds_dir; every siamese training run will exit." >&2
fi

# ============================================================================
# Shared training hyperparameters
# ============================================================================
# Used by both the embedding benchmark and best-per-category pipelines.
# Per-job .conf files can override any of these for independent tuning.

# --- Architecture ---
# Residual encoder with 7 linear layers (ENCODER_DIMS below, width 32; it was
# width 16 until 2026-10-05, and the published model is width 16):
#   entry lift:       Linear(D → 32) [+ LN] + LReLU + Drop           # no skip
#   residual blocks:  5 × [Linear(32→32) [+ LN] + LReLU + Drop] with y = x + F(x)
#   projection:       Linear(32 → 32)                                # latent 32
# D = k + CELL_LINE_DIM for the per_head variants and D = k for the pooled
# ones (no cell-line embedding), k = the combo's input width after its PCA
# arm's PCA (in arm none the concatenated native widths, ≈4.4k-4.9k; see "PCA
# arms" below) or a single-embedding run's (native, or after the per-modality
# PCA in arms per_modality and both). [+ LN]: the cell-line model (every variant)
# has LayerNorm only when ARCH_ARGS contains --layernorm; train.py's default
# puts an identity there. The single-output SiameseSL (USE_CELL_LINES=0)
# always keeps it.
# The residual skips (same-width hidden blocks) keep gradient flow through
# the deeper stack — plain narrow deep MLPs without skips hit rank-collapse
# / gradient-pathway issues (Pennington 2017; Hanin & Rolnick 2019).
# The entry lift compresses the combo input ~140-150× in arm none (D≈4.4k-4.9k
# → 32), less in the PCA arms.
# See SIAMESE_ENCODER_TYPE below to switch back to the plain MLP variant.
ENCODER_DIMS="32 32 32 32 32 32 32"
MODEL_ARGS="--model_type siamese --no-last-layer-bias"

# --- Siamese encoder variant ---
# "residual" (default): same-width hidden blocks get y = x + F(x) skip
#            connections — cleaner gradient flow, enables deeper stacks.
# "mlp":     plain stack of Linear→[LN]→LReLU→Dropout blocks (no skips; LN
#            as above, only with --layernorm in the cell-line model).
# Overridable via env var. ENCODER_DIMS above is tuned for the residual
# variant (first layer is the entry lift, middle layers are same-width
# for skips); if switching to "mlp", also widen/reshape ENCODER_DIMS and
# adjust L1_LAMBDAS accordingly.
SIAMESE_ENCODER_TYPE="${SIAMESE_ENCODER_TYPE:-residual}"

# --- Extra architecture flags (ARCH_ARGS) ---
# Appended verbatim to EVERY siamese train.py call (embedding benchmark,
# best-per-category selection runs, combo, ablation) and echoed in each job
# log, so the SiameseSLMultiCell architecture switches live in one place.
# Empty = train.py's own defaults (no LayerNorm, tau learned directly,
# per-head projection bias, checkpoint selection / early stopping on the
# validation auprg_any). The published model is
#   ARCH_ARGS="--layernorm --log_temperature --no_per_head_last_layer_bias --select_metric auprg --no_gene_term --no_pair_features"
# together with ENCODER_DIMS="16 16 16 16 16 16 16" (edit it above: it has no
# environment override) in PCA arm joint at PCA_JOINT_VARIANCE=0.8 (PCA arms,
# below); see ARCHITECTURE_CHANGES.md
# (its --no-last-layer-bias is already in MODEL_ARGS; --select_metric auprg
# restores its stratified-AUPRG selection rule). --kernel/--cell_lines, and
# any argparse abbreviation of them, are REFUSED here: they are set per variant
# by SIAMESE_VARIANTS below, and a later copy on the command line would
# silently override the variant (argparse keeps the last one), training all
# four variants identically.
# The PCA flags (--pca_variance, --pca_dims, --post_pca_variance,
# --post_pca_dim, --no_post_pca, an abbreviation of one, any =value form) are
# REFUSED too: last on every command line, one would silently override the
# PCA of the job's arm (PCA arms, below; the logs echo only ARCH_ARGS), so
# every arm would train the same PCA under its own arm's name.
# --pca_method (PCA_METHOD) is the preprocessing, not a PCA arm.
# Two extra score terms are ON by train.py's default since 2026-10-05, so an
# empty ARCH_ARGS trains them: a per-gene propensity g(h_i) + g(h_j) added to
# each head's logit, and a symmetric MLP of [|z_i - z_j|, z_i * z_j]. They
# apply to all four variants (cell-line model only). To drop either:
#   ARCH_ARGS="--no_gene_term --no_pair_features"
# With the pair term the dense all-pairs export scores every gene pair through
# that MLP, so the per-fold export is slower.
ARCH_ARGS="${ARCH_ARGS:-}"
# Word by word, on PREFIXES. train.py's parser now sets allow_abbrev=False, so
# `--kern bilinear` is rejected there too — but this check names the cause
# (ARCH_ARGS vs SIAMESE_VARIANTS) on the login node instead of failing a GPU
# task, and covers a parser that loses the flag again. Splitting $ARCH_ARGS
# unquoted is the
# same split the train.py calls do, so tab/newline-separated forms — which a
# match on " --kernel " also misses — are covered too. --cell_lines* is
# deliberately narrower than --cell_line*: --cell_line_dim stays allowed (its
# shorter prefixes are ambiguous with it, so argparse rejects them itself).
for _arch_arg in $ARCH_ARGS; do
    case "$_arch_arg" in
        --k*|--cell_lines*)
            echo "ERROR: ARCH_ARGS must not set --kernel/--cell_lines, or an" \
                 "abbreviation of either (use SIAMESE_VARIANTS): $ARCH_ARGS" >&2
            return 1 ;;
        --pca_v*|--pca_d*|--post_pca*|--no_post*)
            echo "ERROR: ARCH_ARGS must not set a PCA (--pca_variance," \
                 "--pca_dims, --post_pca_variance, --post_pca_dim," \
                 "--no_post_pca, or an abbreviation of one): the PCA is the" \
                 "PCA arm's (PCA_ARMS / PCA_ARM, PCA_MODALITY_VARIANCE," \
                 "PCA_JOINT_VARIANCE, PCA_JOINT_DIM in" \
                 "siamese_sl/slurm/config.conf): $ARCH_ARGS" >&2
            return 1 ;;
        --selection_*|--fold_*)
            echo "ERROR: ARCH_ARGS must not set --selection_frac," \
                 "--selection_seed or --fold_modalities: the selection split" \
                 "is SELECTION_FRAC / SELECTION_SEED and the per-fold" \
                 "modality sets the combo job's (SELECTION_MODE), in" \
                 "siamese_sl/slurm/config.conf: $ARCH_ARGS" >&2
            return 1 ;;
        --al*)
            echo "ERROR: ARCH_ARGS must not set --all_modalities (or an" \
                 "abbreviation): only slurm/run_allmod_combo.sh (ALLMOD_COMBO)" \
                 "trains the all-modalities model; on every other call it would" \
                 "label a selected combo as one: $ARCH_ARGS" >&2
            return 1 ;;
    esac
done
unset _arch_arg

# --- Modality-selection split and mode (2026-11-12, ICLR review) ---
# SELECTION_FRAC: train.py --selection_frac on EVERY siamese training of a run
#   (embedding benchmark, Step-1 single-embedding runs, every variant's combo,
#   the leave-one-category-out ablations), so every SLeuth model trains on the
#   same pairs: a uniform random SELECTION_FRAC of each fold's TRAINING pairs
#   (random pairs at every tier, as cv1's splits) is held out of training and
#   the val-selected checkpoint is scored on it once (fold_metrics[k] sel_*;
#   identical pairs in every run on the same folds and SELECTION_SEED,
#   fold_metrics[k].sel_digest). Empty or 0 = off (default 0.1 since 2026-11-13): no flag is
#   passed and every run is what it was before. The ICLR retrain uses 0.1.
#   It is an arch_signature key (with SELECTION_SEED), so an ablation must
#   match its combo and a Step-1 candidate the combo's expected signature.
# SELECTION_SEED: --selection_seed (independent of SEED), default 42.
# SELECTION_MODE: how the combo job's Step 2 picks each category's embedding:
#   default: per_fold when SELECTION_FRAC > 0, else global (2026-11-13: a
#            hand job with the split but no mode used to fall back to global
#            silently; pass SELECTION_MODE=global explicitly to get it)
#   global   once, on SELECTION_CV's fold-mean VALIDATION score,
#            reused for every fold of every CV (not leakage-free across folds)
#   per_fold for EACH CV and EACH fold k, on that fold's own selection split:
#            the argmax of fold_metrics[k]["sel_<select_metric>"] of
#            SELECTION_VARIANT's Step-1 runs of that CV (refused when the
#            candidates' sel_digest differ or one lacks the key); each CV's
#            combo is ONE run over the union of its folds' winners with
#            --fold_modalities (fold_selection.py). Needs SELECTION_FRAC > 0.
# Revision default (2026-11-13): 0.1 (SELECTION_FRAC= or 0 turns it off).
SELECTION_FRAC="${SELECTION_FRAC-0.1}"
SELECTION_SEED="${SELECTION_SEED:-42}"
if [ -n "$SELECTION_FRAC" ] && ! awk -v f="$SELECTION_FRAC" \
        'BEGIN { exit !(f ~ /^([0-9]+\.?[0-9]*|\.[0-9]+)$/ && f + 0 < 1) }'; then
    echo "ERROR: SELECTION_FRAC='$SELECTION_FRAC': a fraction in [0, 1) (e.g. 0.1)," \
         "or empty for no selection split" >&2
    return 1
fi
case "$SELECTION_SEED" in
    ""|*[!0-9]*)
        echo "ERROR: SELECTION_SEED='$SELECTION_SEED': a non-negative integer" >&2
        return 1 ;;
esac
SELECTION_ARGS=""
if [ -n "$SELECTION_FRAC" ] && awk -v f="$SELECTION_FRAC" 'BEGIN { exit !(f + 0 > 0) }'; then
    SELECTION_ARGS="--selection_frac $SELECTION_FRAC --selection_seed $SELECTION_SEED"
fi
if [ -z "${SELECTION_MODE:-}" ]; then
    if [ -n "$SELECTION_ARGS" ]; then SELECTION_MODE=per_fold; else SELECTION_MODE=global; fi
fi
case "$SELECTION_MODE" in
    global) ;;
    per_fold)
        if [ -z "$SELECTION_ARGS" ]; then
            echo "ERROR: SELECTION_MODE=per_fold needs a selection split: set" \
                 "SELECTION_FRAC > 0 (e.g. 0.1)" >&2
            return 1
        fi ;;
    *)
        echo "ERROR: SELECTION_MODE='$SELECTION_MODE': global or per_fold" >&2
        return 1 ;;
esac
export SELECTION_FRAC SELECTION_SEED SELECTION_MODE

# --- Model variants: the 2x2 grid kernel {pd, bilinear} x cell_lines {per_head, pooled} ---
# Each entry "KERNEL:CELL_LINES" becomes train.py `--kernel KERNEL
# --cell_lines CELL_LINES` (siamese_variant_args below).
#   pd       — z_i^T z_j (+ eps h_i^T h_j), the positive-definite kernel
#   bilinear — symmetrised z_i^T A z_j, A learnable (init I); need not be PD
#   per_head — 8 cell-line heads + cell-line embedding, masked multi-label BCE
#   pooled   — ONE head on the OR label (SL in any line), no cell-line embedding
# The combo (run_best_per_category_combo.sh Step 3), the external-screen eval
# and the ablation each run once PER VARIANT (in every PCA arm, below), and
# sl_comparison gets one siamese row per variant.
#
# MODALITY SELECTION IS NOT PER VARIANT. The single-embedding runs
# (run_embedding_benchmark.sh, run_best_per_category.sh) and the category-winner
# selection run ONCE, under SELECTION_VARIANT, and every variant's combo
# concatenates THOSE winners. Four separate selections would hand each variant a
# different modality set, and a variant's difference could no longer be told
# apart from its different inputs — the 2x2 would confound kernel / pooling with
# feature selection.
#
# Directory naming. The baseline pd:per_head keeps the historical names
#   results/best_cat_<names>_<cv>/   results/ablate_no_<cat>_<cv>/
#   results/latest_combo_<cv>.txt
# so the baseline's paths, and the consumers that read them
# (cell_line_ablation/, sl_comparison/collect_siamese.py via the latest_combo
# markers, run_ablation_summary.sh), did not change when the variants were
# added. Existing results under these names are NOT kept: each combo job
# replaces its variants' previous results/<prefix>best_cat_* (see
# run_best_per_category_combo.sh), and each ablation task wipes its own
# <prefix>ablate_no_<cat>_<cv>/ before training.
# Every other variant is PREFIXED with var_<kernel>_<cell_lines>__, e.g.
#   results/var_bilinear_pooled__best_cat_<names>_<cv>/
#   results/var_bilinear_pooled__ablate_no_<cat>_<cv>/
#   results/var_bilinear_pooled__latest_combo_<cv>.txt
# which none of the existing globs ('best_cat_*', 'ablate_no_*',
# 'latest_combo_*') can match. sl_comparison rows: siamese_sl (baseline) and
# siamese_sl_<kernel>_<cell_lines>. Every PCA arm but none repeats this layout
# one directory down, under results/pca_<arm>/ (PCA arms, below), which no
# glob above matches either (none of them recurses).
#
# Env override is a SPACE-separated list in the SCALAR SIAMESE_VARIANTS_LIST:
#   SIAMESE_VARIANTS_LIST="pd:per_head bilinear:pooled" bash slurm/submit_pipeline.sh
# Bash cannot export arrays, so SIAMESE_VARIANTS (the array every script
# iterates) never reaches a compute node: `sbatch --export=ALL` carries only
# scalars, and a job that re-sourced this file used to fall back to all four
# variants while the orchestrator had sized its arrays for the override — every
# eval/ablation task then mapped to the wrong variant. This file therefore
# builds the array from SIAMESE_VARIANTS_LIST and EXPORTS the validated list
# back into it (below), so the orchestrator and every job it submits see the
# same list. SIAMESE_VARIANTS="pd:per_head bilinear:pooled" on the login-node
# command line still works (it is read here once, then carried as
# SIAMESE_VARIANTS_LIST); SIAMESE_VARIANTS_LIST wins when both are set.
# Both flags act only on the cell-line model, so with USE_CELL_LINES!=1 the grid
# collapses to the baseline.
# ----------------------------------------------------------------------------
# GPU node selection
# ----------------------------------------------------------------------------
# Every orchestrated job script carries `#SBATCH --nodelist=gpu3` as its own
# default (2026-10-01, by request; gpu2 from 2026-09-23, after gpu3 failed an
# ECC test, until then). A command-line flag replaces
# only the SAME directive, so both login-node orchestrators pass $GPU_NODE_ARGS
# on every submission (a direct submission of one script still uses the pin):
#   GPU_NODES="gpu4"        -> --nodelist=gpu4: every job of the DAG on gpu4.
#   GPU_NODES="gpu3,gpu4"   -> each one-node job takes whichever listed node is
#                              free, on Slurm >= 23.02 only (older Slurm
#                              rejects a list longer than --nodes).
#   GPU_EXCLUDE="gpu2"      -> adds --exclude=gpu2. It does NOT lift the
#                              directive's --nodelist=gpu3 (SLURM rejects a job
#                              whose required and excluded nodes overlap), so it
#                              only goes with GPU_NODES; check_node_selection
#                              (below) refuses it otherwise.
# Both empty keeps each script's pin. Check the partition's nodes and their
# state with: sinfo -p "$SLURM_PARTITION" -o "%n %t %G"
SLURM_PARTITION="${SLURM_PARTITION:-gpu_Prosmn}"

# --- Array throttles --------------------------------------------------------
# EMPTY (the default) = no `%N` suffix on --array, so SLURM starts as many
# tasks of an array as the partition will give, and the run is limited by the
# cluster rather than by us. Set any of them to a positive integer to cap that
# array (e.g. MAX_CONCURRENT=4 to leave GPUs for other users). Each cap
# applies to each array on its own, and every PCA arm submits its own
# best-per-category (one per pair of arms sharing single-embedding runs),
# ablation and eval arrays, side by side: with all four arms, up to
# 4 x (MAX_CONCURRENT + EVAL_CONCURRENT) tasks of the stage after the combos.
MAX_CONCURRENT="${MAX_CONCURRENT:-}"      # best-per-category + ablation arrays
EVAL_CONCURRENT="${EVAL_CONCURRENT:-}"    # external-screen eval array
SHARED_CONCURRENT="${SHARED_CONCURRENT:-}"  # SLGNN/NSF4SL/SLMGAE array
# array_throttle <value> -> "" (no cap) for empty, 0, none, all or unlimited;
# "%<value>" for a positive integer without a leading zero; else an error.
array_throttle() {
    case "$1" in
        ''|0|none|all|unlimited) echo "" ;;
        *[!0-9]*|0*) echo "ERROR: throttle '$1' is not a positive integer" >&2; return 1 ;;
        *) echo "%$1" ;;
    esac
}
# throttle_label <value> -> the cap for log lines: N, or "unlimited" for every
# no-cap value (so MAX_CONCURRENT=0 is not printed as a cap of 0).
throttle_label() {
    local t
    t=$(array_throttle "$1") || return 1
    t="${t#%}"
    echo "${t:-unlimited}"
}
export MAX_CONCURRENT EVAL_CONCURRENT SHARED_CONCURRENT
# Whitespace is dropped: GPU_NODE_ARGS is expanded unquoted, so "gpu2, gpu4"
# would otherwise split into two sbatch arguments.
GPU_NODES="${GPU_NODES:-}"; GPU_NODES="${GPU_NODES//[[:space:]]/}"
GPU_EXCLUDE="${GPU_EXCLUDE:-}"; GPU_EXCLUDE="${GPU_EXCLUDE//[[:space:]]/}"
GPU_NODE_ARGS=""
if [ -n "$GPU_NODES" ]; then
    GPU_NODE_ARGS="--nodelist=$GPU_NODES"
fi
if [ -n "$GPU_EXCLUDE" ]; then
    GPU_NODE_ARGS="${GPU_NODE_ARGS:+$GPU_NODE_ARGS }--exclude=$GPU_EXCLUDE"
fi
export SLURM_PARTITION GPU_NODES GPU_EXCLUDE GPU_NODE_ARGS
# The orchestrators call these two before changing anything: a selection or
# throttle SLURM would reject otherwise fails at the first submission, after
# step 0 has already rewritten the folds and removed the previous run's outputs.
check_node_selection() {
    local n
    if [ -n "$GPU_EXCLUDE" ] && [ -z "$GPU_NODES" ]; then
        echo "ERROR: GPU_EXCLUDE='$GPU_EXCLUDE' without GPU_NODES: --exclude cannot lift each" >&2
        echo "  script's #SBATCH --nodelist=gpu3 (SLURM rejects a job whose required and" >&2
        echo "  excluded nodes overlap; any other exclusion changes nothing). Set GPU_NODES" >&2
        echo "  to the node(s) to use instead, e.g. GPU_NODES=gpu4." >&2
        return 1
    fi
    for n in ${GPU_EXCLUDE//,/ }; do
        case ",$GPU_NODES," in
            *",$n,"*)
                echo "ERROR: GPU_NODES='$GPU_NODES' and GPU_EXCLUDE='$GPU_EXCLUDE' share $n:" >&2
                echo "  SLURM rejects a job whose required and excluded nodes overlap." >&2
                return 1 ;;
        esac
    done
    return 0
}
# check_throttles [VAR...]: default all three (submit_pipeline.sh passes the
# two it uses; it submits no shared-model array).
check_throttles() {
    local t
    [ $# -gt 0 ] || set -- MAX_CONCURRENT EVAL_CONCURRENT SHARED_CONCURRENT
    for t in "$@"; do
        if ! array_throttle "${!t}" >/dev/null 2>&1; then
            echo "ERROR: $t='${!t}': use a positive integer (a cap), or leave it empty" >&2
            echo "  (also 0, none, all or unlimited) for no cap." >&2
            return 1
        fi
    done
    return 0
}

# Defaults = the ICLR revision run (2026-11-13), so a plain submission
# reproduces the paper: pd:pooled (SLeuth) and pd:per_head (the cell-line
# variant); the bilinear variants run only when listed.
SIAMESE_VARIANTS_LIST="${SIAMESE_VARIANTS_LIST:-${SIAMESE_VARIANTS[*]:-pd:pooled pd:per_head}}"
# Split on whitespace, no globbing, EVERY line: a plain `read` stops at the
# first newline, so a list with one variant per line ($(cat list.txt)) lost
# every variant after the first without a word (2026-10-21). -d '' reads to
# the end; read then returns 1 (no NUL ends it), hence `|| true` under the
# callers' set -e.
read -r -d '' -a SIAMESE_VARIANTS <<< "$SIAMESE_VARIANTS_LIST" || true
SELECTION_VARIANT="${SELECTION_VARIANT:-pd:pooled}"   # variant the single-embedding runs train (revision default: the pooled SLeuth)

# siamese_variant_args KERNEL:CELL_LINES  -> "--kernel KERNEL --cell_lines CELL_LINES"
siamese_variant_args() { echo "--kernel ${1%%:*} --cell_lines ${1#*:}"; }
# siamese_variant_tag KERNEL:CELL_LINES   -> "" for pd:per_head, else "KERNEL_CELL_LINES"
siamese_variant_tag() {
    if [ "$1" = "pd:per_head" ]; then echo ""; else echo "${1%%:*}_${1#*:}"; fi
}
# siamese_variant_prefix KERNEL:CELL_LINES -> "" for pd:per_head, else "var_<tag>__";
# prepended to every per-variant results/ directory and marker name.
siamese_variant_prefix() {
    local tag
    tag=$(siamese_variant_tag "$1")
    echo "${tag:+var_${tag}__}"
}

# --- All-modalities combo (2026-11-12, review response; on by default since 2026-11-13) ---
# ALLMOD_COMBO=1 also trains, per PCA arm of PCA_ARMS and per variant of
# SIAMESE_VARIANTS, the multi-modal model on EVERY catalog embedding with no
# modality selection (slurm/run_allmod_combo.sh: one array task per CV, same
# training settings, ARCH_ARGS and selection split as the arm's selected
# combo; no Step-1 run or selection is read). Both orchestrators submit it
# after the generation only, and the arm's compare waits for it; its rows
# siamese_sl_allmod[_<tag>] are collected (collect_and_regrade_siamese.sh) and
# tabulated (paper_tables tab_tiers, kind "ablation") only with ALLMOD_COMBO=1,
# so a run without it is unchanged and never incomplete for their absence.
# 0 | 1 (default since 2026-11-13); exported, so every job and the sl_comparison jobs see it.
# Revision default (2026-11-13): 1, the paper reports the all-modalities row.
ALLMOD_COMBO="${ALLMOD_COMBO:-1}"
case "$ALLMOD_COMBO" in
    0|1) ;;
    *) echo "ERROR: ALLMOD_COMBO must be 0 or 1, got '$ALLMOD_COMBO'" >&2
       return 1 ;;
esac
export ALLMOD_COMBO
# allmod_prefix KERNEL:CELL_LINES -> "allmod__" + siamese_variant_prefix: the
# prefix of the all-modalities model's <arm root>/<prefix>all_modalities_<cv>/
# and its marker <arm root>/<prefix>latest_allmod_<cv>.txt. No selected
# combo's glob (<prefix>best_cat_*, *latest_combo_cv*) matches either.
allmod_prefix() { echo "allmod__$(siamese_variant_prefix "$1")"; }
# allmod_row KERNEL:CELL_LINES -> its sl_comparison row: siamese_sl_allmod for
# pd:per_head, siamese_sl_allmod_<tag> otherwise (as siamese_sl[_<tag>]).
allmod_row() {
    local tag
    tag=$(siamese_variant_tag "$1")
    echo "siamese_sl_allmod${tag:+_$tag}"
}

if [ ${#SIAMESE_VARIANTS[@]} -eq 0 ]; then
    echo "ERROR: SIAMESE_VARIANTS_LIST is empty; list at least one KERNEL:CELL_LINES" >&2
    return 1
fi
for _v in "${SIAMESE_VARIANTS[@]}" "$SELECTION_VARIANT"; do
    case "$_v" in
        pd:per_head|pd:pooled|bilinear:per_head|bilinear:pooled) ;;
        *) echo "ERROR: invalid siamese variant '$_v' (want KERNEL:CELL_LINES," \
                "KERNEL in pd|bilinear, CELL_LINES in per_head|pooled)" >&2
           return 1 ;;
    esac
done
unset _v
if [ -n "$(printf '%s\n' "${SIAMESE_VARIANTS[@]}" | sort | uniq -d)" ]; then
    echo "ERROR: SIAMESE_VARIANTS lists a variant twice: ${SIAMESE_VARIANTS[*]}" >&2
    return 1
fi
if [ "$USE_CELL_LINES" != "1" ] \
   && [ "${SIAMESE_VARIANTS[*]} $SELECTION_VARIANT" != "pd:per_head pd:per_head" ]; then
    echo "NOTE: USE_CELL_LINES=$USE_CELL_LINES; --kernel/--cell_lines act only on" \
         "the cell-line model (train.py refuses them without it), so" \
         "SIAMESE_VARIANTS collapses to pd:per_head (the single-output model)." >&2
    SIAMESE_VARIANTS=("pd:per_head")
    SELECTION_VARIANT="pd:per_head"
fi
# The validated (and possibly collapsed) list, as an exported scalar: this is
# what carries the override into every sbatch --export=ALL job.
export SIAMESE_VARIANTS_LIST="${SIAMESE_VARIANTS[*]}"

# --- Training ---
EPOCHS=2000
BATCH_SIZE=256
LR=0.001
WEIGHT_DECAY=0.00001
DROPOUT=0.2
EVAL_INTERVAL=30
PATIENCE=10
NUM_FOLDS=5
POS_NEG_RATIO=1.0   # passed to train.py but NO effect: the shared folds fix the class balance (see NEG_PATH)
SEED="${SEED:-42}"   # honor an exported SEED (e.g. from the root benchmark orchestrator); default 42
# One id per pipeline submission. Both orchestrators (submit_pipeline.sh,
# run_benchmarking_siamese_vs_others.sh) set one on the login node before
# the first sbatch (fresh, except submit_pipeline.sh --ablation-only and the
# root --skip-siamese, which join the reused run's), so it is kept here and
# reaches every job of that submission (--export=ALL), every PCA arm's
# included. Benchmark, Step-1 and ablation runs record it in
# <output_dir>/run_token.txt, and the combo's Step 2 / the summaries refuse a
# directory carrying another submission's token: a task that never started
# leaves its previous run's results.json on disk, and nothing else tells it
# apart from this run's. A job sbatch'ed on its own gets a fresh token (each
# array task its own), so export one before submitting stages by hand, or the
# token of the run a job must join (cat <dir>/run_token.txt).
export RUN_TOKEN="${RUN_TOKEN:-$(date +%Y%m%dT%H%M%S)-$$}"
WARMRESTART_T0=50
WARMRESTART_TMULT=2

# --- Regularization ---
# L1_LAMBDAS: per-layer proximal L1 (ONE value per weight matrix; the count
# must equal len(ENCODER_DIMS) since every entry in ENCODER_DIMS creates one
# Linear layer — entry + residual blocks + projection).
# Decreasing pattern — early layers see raw concatenated features and benefit
# from aggressive sparsification; later layers are already compressed.
# Halved from the width-24 schedule (0.02, ...) when the entry lift was width 6
# (~900 weights at D≈150) and the prior schedule would over-prune. ENCODER_DIMS
# is width 32 now, and in PCA arm none (no PCA) the combo's entry layer is
# Linear(k+24 -> 32) for the per_head variants and Linear(k -> 32) for the
# pooled ones, k = the concatenated width (≈4.4k-4.9k), i.e. ~140k-157k
# weights rather than the ~2.7k these lambdas were last reasoned about, and
# each 32x32 block has 4x the weights of the 16x16 ones. They are
# inherited, not derived, and are NOT retuned for this width, nor for the
# narrower inputs of the other PCA arms; k also moves with the combo's
# modality selection, so the same lambda prunes a different-sized layer from
# run to run.
# If the sparsity pattern looks wrong, retune here.
L1_LAMBDAS="0.01 0.0075 0.005 0.004 0.0025 0.0015 0.001"
# PD_EPSILON: positive-definiteness regularizer (0 to disable)
PD_EPSILON=0.001

# --- PCA arms: the whole pipeline once per PCA choice (2026-10-20) ---------
# The 2x2 of PCA within each modality (no / yes) x PCA on the concatenation of
# all modalities (no / yes). Each arm is the WHOLE siamese pipeline (the
# single-embedding runs, the modality selection, every variant's combo, the
# eval, the leave-one-category-out ablation, the cell-line ablation, the
# compare, the external transfer, the paper tables and the pair export):
#   none          no PCA: each modality mean-imputed and normalized by one
#                 global mean/std (PCA_METHOD=plain), then concatenated; the
#                 encoder reads the full width (4,424-4,864d on the modality
#                 sets selected so far). The reported model since 2026-10-05.
#   joint         PCA on the concatenation of all modalities: train.py
#                 --post_pca_variance PCA_JOINT_VARIANCE, or --post_pca_dim
#                 PCA_JOINT_DIM (the published model's PCA; the default from
#                 2026-07-13 to 2026-10-05, at POST_PCA_VARIANCE=0.8 but for
#                 POST_PCA_DIM=145 from 2026-08-12 to 2026-08-24)
#   per_modality  PCA within each modality, then concatenated: --pca_variance
#                 PCA_MODALITY_VARIANCE (the default from 2026-04-08 to
#                 2026-04-18, under ROBPCA; --pca_dims 64 before)
#   both          per_modality, then joint (the default from 2026-04-18 to
#                 2026-07-13, under PCA_METHOD=robust)
# (Dates from the git history, for matching an older result to its arm; the
# per_modality line said "the default until 2026-07-13" until 2026-10-21,
# which put the both-stage runs of April to July under the wrong arm.)
# Under PCA_METHOD=plain a PCA z-scores every column first (none rescales a
# modality by one scalar only), and a variance target resolves k per fold on
# the fit rows' correlation spectrum (train.py logs it): on the 2026-08-11 cv1
# winner set (4,864 columns), re-fit on the current embedding files and shared
# folds, cv1 fold 0 at 0.8, none 4,864, per_modality 1,951, joint 1,570 and
# both 1,291 encoder inputs. L1_LAMBDAS is retuned for none of them.
# PCA_JOINT_DIM is ONE count for both arms with the joint stage, joint AND
# both, and they meet very different widths: it must stay below the narrowest
# concatenation the joint PCA acts on in any run of either arm, the combo and
# each leave-one-category-out ablation alike. In arm both that is the kept
# modalities' per-modality components (about 1,951 for the 2026-08-11 cv1
# combo at 0.8, lower in every ablation: about 1,140 without ppi, whose
# ppi_raw keeps about 810; and it moves per fold and per CV); in arm joint the
# native width without the widest category (about 3.1k or more). A count at or
# above that width runs no joint PCA at all under a label that says it ran, so
# train.py refuses it (data_loader's fit, 2026-10-21) at the fit of the first
# fold that narrow, in each combo or ablation run separately, after the Step-1
# array: in arm joint at fold 0 (its native width is the same in every fold);
# in arm both, where the width moves per fold and CV, earlier folds, and in the
# combo job whole earlier combos, may have trained by then (the refused run
# writes no marker; the combo job goes on with its other combos). The
# orchestrators' --print_arch check loads no data and cannot see a width.
# ("at the first fold of the combo or ablation job" until 2026-10-21: true in
# arm joint only.)
#
# Single-embedding runs (Step 1, the embedding benchmark) get the per-modality
# stage only (pca_single_args): native dimension in none and joint,
# --pca_variance in per_modality and both. The joint PCA acts on a
# concatenation: on one modality it would repeat the per-modality PCA (joint:
# the z-scoring undoes the scalar normalize) or, after it (both), meet
# components that are already uncorrelated, a flat spectrum from which a
# variance target keeps an arbitrary subspace. So none and joint rank the SAME
# single-embedding runs, as do per_modality and both: each pair has one Step-1
# array, in the results root of the pair's first arm that PCA_ARMS lists
# (pca_step1_arm), and both arms of a pair select the same winners, so joint is
# none plus the joint PCA, and both is per_modality plus the joint PCA, on one
# modality set each.
#
# Where an arm writes: arm none keeps the historical paths, every other arm
# writes the same names one directory down (pca_arm_results, pca_arm_cmp):
#   none:  siamese_sl/results/            sl_comparison/results/
#   X:     siamese_sl/results/pca_X/      sl_comparison/results/pca_X/
# The shared models' rows (SLGNN / NSF4SL / SLMGAE / DegreePrior) stay in
# sl_comparison/results/ for every arm; each arm's comparison reads them there.
#
# PCA_ARMS: the arms the orchestrators run, a space-separated scalar
# (exported; any subset, always run in the order above; default all four).
# PCA_ARM: the arm of ONE job. The orchestrators submit each arm's jobs with
# the arm in sbatch's own environment and a plain --export=ALL
# (`PCA_ARM=<arm> sbatch ... --export=ALL`; never an --export list, which
# Slurm reads as an implied --get-user-env, 2026-10-21); a job submitted by
# hand trains arm none unless PCA_ARM is exported or passed that way (export
# the same PCA_* values as the run it joins).
# A PCA_ARMS that is set but empty (PCA_ARMS= , or "$ARMS" of an empty
# variable) is refused, not read as all four: a run of all four removes every
# arm's outputs at submission. Unset, it is "none joint" (all four until 2026-11-13).
if [ -n "${PCA_ARMS+x}" ] && [ -z "$PCA_ARMS" ]; then
    echo "ERROR: PCA_ARMS is set but empty; list at least one of none joint" \
         "per_modality both, or unset it for none joint" >&2
    return 1
fi
# Revision default (2026-11-13): the no-PCA headline and the joint-PCA
# ablation; per_modality / both run only when listed.
PCA_ARMS="${PCA_ARMS:-none joint}"
PCA_ARM="${PCA_ARM:-none}"
PCA_MODALITY_VARIANCE="${PCA_MODALITY_VARIANCE:-0.8}"
PCA_JOINT_VARIANCE="${PCA_JOINT_VARIANCE:-0.8}"
# PCA_JOINT_DIM: an exact count; wins over PCA_JOINT_VARIANCE. One count for
# arms joint and both, below the narrowest width either meets (above).
PCA_JOINT_DIM="${PCA_JOINT_DIM:-}"
# POST_PCA_VARIANCE / POST_PCA_DIM (the reported model's opt-in post-concat PCA
# until 2026-10-20) are refused, not reinterpreted: an old recipe would
# otherwise train all four arms. Arm joint is that pipeline now.
if [ -n "${POST_PCA_VARIANCE:-}" ] || [ -n "${POST_PCA_DIM:-}" ]; then
    echo "ERROR: POST_PCA_VARIANCE / POST_PCA_DIM are replaced by the PCA arms:" \
         "PCA_ARMS=joint PCA_JOINT_VARIANCE=<fraction> (or PCA_JOINT_DIM=<count>)" \
         "trains the post-concat PCA pipeline (siamese_sl/slurm/config.conf," \
         "PCA arms)." >&2
    return 1
fi
# A fraction in (0, 1) written 0.<digits>, at least one of them non-zero.
_pca_fraction_ok() {
    case "$1" in
        0.*[!0-9]*|0.) return 1 ;;
        0.*[1-9]*) return 0 ;;
        *) return 1 ;;
    esac
}
for _v in PCA_MODALITY_VARIANCE PCA_JOINT_VARIANCE; do
    if ! _pca_fraction_ok "${!_v}"; then
        echo "ERROR: $_v='${!_v}': want a fraction in (0, 1), e.g. 0.8" >&2
        return 1
    fi
done
case "$PCA_JOINT_DIM" in
    '') ;;
    *[!0-9]*|0*)
        echo "ERROR: PCA_JOINT_DIM='$PCA_JOINT_DIM': want a positive integer" \
             "(no leading zero), or empty for PCA_JOINT_VARIANCE" >&2
        return 1 ;;
esac
case "$PCA_ARM" in
    none|joint|per_modality|both) ;;
    *) echo "ERROR: PCA_ARM='$PCA_ARM' (want none, joint, per_modality or both)" >&2
       return 1 ;;
esac
# Split without globbing, refuse an unknown or repeated arm, keep the order above.
# Every line of the value, not only its first: a plain `read` stops at the
# first newline, and PCA_ARMS=$'none\njoint' (one arm per line, $(cat
# arms.txt)) ran arm none alone, an unknown or repeated name after the newline
# never refused (2026-10-21). -d '' reads to the end of the value; read then
# returns 1 (no NUL ends it), hence `|| true` under the orchestrators' set -e.
read -r -d '' -a _pca_words <<< "$PCA_ARMS" || true
_pca_seen=" "
for _a in ${_pca_words[@]+"${_pca_words[@]}"}; do
    case "$_a" in
        none|joint|per_modality|both) ;;
        *) echo "ERROR: PCA_ARMS='$PCA_ARMS': '$_a' is not an arm (none joint" \
                "per_modality both)" >&2
           return 1 ;;
    esac
    case "$_pca_seen" in
        *" $_a "*) echo "ERROR: PCA_ARMS='$PCA_ARMS' lists $_a twice" >&2
                   return 1 ;;
    esac
    _pca_seen="$_pca_seen$_a "
done
PCA_ARMS=""
for _a in none joint per_modality both; do
    case "$_pca_seen" in *" $_a "*) PCA_ARMS="${PCA_ARMS:+$PCA_ARMS }$_a" ;; esac
done
unset _pca_words _pca_seen _a _v
if [ -z "$PCA_ARMS" ]; then
    echo "ERROR: PCA_ARMS is empty; list at least one of none joint per_modality both" >&2
    return 1
fi
read -r -a PCA_ARM_LIST <<< "$PCA_ARMS"
export PCA_ARMS PCA_ARM PCA_MODALITY_VARIANCE PCA_JOINT_VARIANCE PCA_JOINT_DIM

# pca_arm_dir ARM -> "" for none, else "pca_<ARM>": the subdirectory of
# siamese_sl/results/ and sl_comparison/results/ the arm writes to.
pca_arm_dir() { [ "$1" = none ] || echo "pca_$1"; }
# pca_arm_results ARM -> the arm's siamese results root, relative to siamese_sl/
# (every siamese job runs there): results, or results/pca_<ARM>.
pca_arm_results() {
    local d
    d=$(pca_arm_dir "$1")
    echo "results${d:+/$d}"
}
# pca_arm_cmp ARM -> the arm's sl_comparison results root, relative to the repo
# root: sl_comparison/results, or sl_comparison/results/pca_<ARM>.
pca_arm_cmp() {
    local d
    d=$(pca_arm_dir "$1")
    echo "sl_comparison/results${d:+/$d}"
}
# pca_step1_arm ARM -> the arm whose results root holds ARM's single-embedding
# runs (Step 1, the embedding benchmark): the first arm of ARM's pair (none,
# joint) or (per_modality, both) that PCA_ARMS lists, else ARM itself. So the
# default run keeps them in results/ and results/pca_per_modality/, and a run
# of joint alone (PCA_ARMS=joint) trains its own in results/pca_joint/ instead
# of rewriting arm none's.
pca_step1_arm() {
    local a pair
    case "$1" in
        per_modality|both) pair="per_modality both" ;;
        *)                 pair="none joint" ;;
    esac
    for a in $pair; do
        case " $PCA_ARMS " in *" $a "*) echo "$a"; return 0 ;; esac
    done
    echo "$1"
}
# pca_pair_closed IN_ARMS ARM... -> the ARMs plus the pair partner of each that
# IN_ARMS lists, in none/joint/per_modality/both order. A printed retrain of
# one arm of a pair whose other arm the run keeps (PCA_ARMS=joint beside none)
# made that arm its own Step-1 owner (pca_step1_arm), so the pair's two arms no
# longer shared one modality set: the orchestrators' retrain lines retrain the
# pair whole instead (2026-10-24).
pca_pair_closed() {
    local in=" $1 " a b out=" " r=""
    shift
    for a in "$@"; do
        case "$a" in
            none) b=joint ;; joint) b=none ;;
            per_modality) b=both ;; both) b=per_modality ;;
            *) b="" ;;
        esac
        out="$out$a "
        if [ -n "$b" ]; then
            case "$in" in *" $b "*) out="$out$b " ;; esac
        fi
    done
    for a in none joint per_modality both; do
        case "$out" in *" $a "*) r="${r:+$r }$a" ;; esac
    done
    echo "$r"
}
_pca_joint_args() {
    if [ -n "$PCA_JOINT_DIM" ]; then echo "--post_pca_dim $PCA_JOINT_DIM"
    else echo "--post_pca_variance $PCA_JOINT_VARIANCE"; fi
}
# pca_multi_args ARM -> the train.py PCA flags of ARM's multi-modal trainings
# (the combo and the leave-one-category-out ablation).
pca_multi_args() {
    case "$1" in
        joint)        _pca_joint_args ;;
        per_modality) echo "--pca_variance $PCA_MODALITY_VARIANCE --no_post_pca" ;;
        both)         echo "--pca_variance $PCA_MODALITY_VARIANCE $(_pca_joint_args)" ;;
        *)            echo "--no_post_pca" ;;
    esac
}
# pca_single_args ARM -> the train.py PCA flags of ARM's single-embedding runs.
pca_single_args() {
    case "$1" in
        per_modality|both) echo "--pca_variance $PCA_MODALITY_VARIANCE --no_post_pca" ;;
        *)                 echo "--no_post_pca" ;;
    esac
}
# pca_arm_label ARM -> one line saying what ARM trains (job logs, summaries).
pca_arm_label() {
    local j
    if [ -n "$PCA_JOINT_DIM" ]; then j="$PCA_JOINT_DIM components"
    else j="variance $PCA_JOINT_VARIANCE"; fi
    case "$1" in
        joint)        echo "PCA on the concatenation of all modalities ($j)" ;;
        per_modality) echo "PCA within each modality (variance $PCA_MODALITY_VARIANCE)" ;;
        both)         echo "PCA within each modality (variance $PCA_MODALITY_VARIANCE), then on their concatenation ($j)" ;;
        *)            echo "no PCA" ;;
    esac
}
# pca_step1_arms ARM -> the arms of this run that read ARM's single-embedding
# runs (pca_step1_arm's root): those of ARM's pair that PCA_ARMS lists, and ARM.
pca_step1_arms() {
    local a pair out=""
    case "$1" in
        per_modality|both) pair="per_modality both" ;;
        *)                 pair="none joint" ;;
    esac
    for a in $pair; do
        case " $PCA_ARMS $1 " in *" $a "*) out="${out:+$out }$a" ;; esac
    done
    echo "$out"
}
# pca_step1_label ARM -> one line saying what ARM's single-embedding runs train
# and which arms of this run read them.
pca_step1_label() {
    local arms who
    arms=$(pca_step1_arms "$1")
    case "$arms" in
        *" "*) who="shared by arms ${arms% *} and ${arms#* }" ;;
        *)     who="used by arm $arms only" ;;
    esac
    case "$1" in
        per_modality|both) echo "single-embedding runs with PCA within the modality (variance $PCA_MODALITY_VARIANCE), $who" ;;
        *)                 echo "single-embedding runs at native dimension (no PCA), $who" ;;
    esac
}
# pca_targets_env -> this shell's PCA targets as NAME=VALUE words, e.g.
# "PCA_MODALITY_VARIANCE=0.8 PCA_JOINT_VARIANCE=0.8 PCA_JOINT_DIM=": what the
# orchestrators' PCA checks compare with, and what each command they print to
# paste sets for its job, so that the job trains and labels this run's
# targets whatever the pasting shell exports (an empty PCA_JOINT_DIM= clears
# one). No value needs quoting: each was validated above.
pca_targets_env() {
    echo "PCA_MODALITY_VARIANCE=$PCA_MODALITY_VARIANCE PCA_JOINT_VARIANCE=$PCA_JOINT_VARIANCE PCA_JOINT_DIM=$PCA_JOINT_DIM"
}
# pca_targets_with "NAME=VALUE ..." -> pca_targets_env, all three, with those
# words (pca_check_combos' exports) in their place: the targets a printed
# command sets in full, whatever the shell it is pasted into exports. Moved here
# from the root orchestrator (its _targets_with) on 2026-10-21, for
# submit_pipeline.sh --ablation-only's refusal too: it printed only the targets
# that differ, and a target of the refused run's one-shot prefix never reached
# the shell the command was pasted into (refused again, the other target
# printed, endlessly).
pca_targets_with() {
    local w e out=""
    for w in $(pca_targets_env); do
        for e in $1; do [ "${e%%=*}" != "${w%%=*}" ] || w="$e"; done
        out="${out:+$out }$w"
    done
    echo "$out"
}
# pca_check_combos --arm ARM FLAGS KEY=CONFIG.JSON ... [--arm ...] -> how
# each listed combo's PCA (its config.json) compares with the PCA FLAGS train
# (pca_multi_args), on the keys every ablation task compares, and the targets
# to export where they differ (arch_signature.py --check_pca, given this
# shell's targets: pca_targets_env). For the orchestrators' --ablation-only and
# --skip-siamese, which reuse an earlier submission's combos and check them
# before anything changes (2026-10-21). Prints the helper's lines; returns 1,
# printing nothing, when neither PYTHON_PATH nor python3 runs it through to its
# closing "end" (no venv on this node, an older arch_signature.py): the callers
# then only warn, as every task still checks its own combo.
pca_check_combos() {
    local out py
    for py in "$PYTHON_PATH" python3; do
        out=$("$py" "$WORK_DIR/arch_signature.py" --check_pca \
                  --targets "$(pca_targets_env)" "$@" 2>/dev/null) || continue
        [ "$(printf '%s\n' "$out" | tail -n 1)" = end ] || continue
        printf '%s\n' "$out" | sed '$d'
        return 0
    done
    return 1
}
# pasted_env_def [NAME=VALUE ...] -> the first line of every block of sbatch
# commands the orchestrators print to paste: it defines _paste_env, so that
# each pasted `_paste_env PCA_ARM=<arm> [NAME=VALUE ...] sbatch ...` runs sbatch
# under env with the given settings (the arms and PCA targets here: a run's
# own, or in the root's rebuild of the arms it leaves out the arms of its table
# across the arms; then the settings the pasted jobs read; the job's arm and
# any target of its own on its line: the last one wins) and
# without the pasting shell's RUN_TOKEN and CODE_MANIFEST (each arm's tables
# then check its dirs against its own selection's token; no code manifest is
# only noted) or any compare pin collect_and_regrade_siamese.sh reads:
# SIAMESE_BASELINE_DISCOVER and SIAMESE_RESULTS_<cv> / SIAMESE_RESULTS_<tag>_<cv>
# of every variant and CV this file accepts, not only the run's (a pin applies
# to whichever arm a compare collects: left over from a hand compare, it graded
# another run's or arm's combo under the pasted arm's label until 2026-10-21).
# Nor the pasting shell's ALLMOD_COMBO (2026-11-12): every block passes the
# run's own ALLMOD_COMBO=0|1 (2026-11-13: since the default became 1, a block
# that left it out for a run with 0 collected / tabulated all-modalities rows
# that run never trained).
# The pasting shell keeps them all; bash and zsh alike. A VALUE of plain
# characters (the words this file validates) is double-quoted when it holds a
# space, as before; any other (ARCH_ARGS: train.py flags, not validated here,
# since 2026-10-21) is printf %q-quoted, which bash and zsh read back as the
# same string with nothing in it expanded. An empty VALUE is still set (NAME=):
# the job then takes its own default, never the pasting shell's value.
pasted_env_def() {
    local u="-u RUN_TOKEN -u CODE_MANIFEST -u SIAMESE_BASELINE_DISCOVER -u ALLMOD_COMBO" v t cv q
    for v in pd:per_head pd:pooled bilinear:per_head bilinear:pooled; do
        t=$(siamese_variant_tag "$v")
        for cv in cv1 cv2 cv3; do u="$u -u SIAMESE_RESULTS_${t:+${t}_}$cv"; done
    done
    for v in "$@"; do
        case "${v#*=}" in
            *[![:alnum:]_.:,/+=@%\ -]*)
                   printf -v q '%q' "${v#*=}"; u="$u ${v%%=*}=$q" ;;
            *" "*) u="$u ${v%%=*}=\"${v#*=}\"" ;;
            *)     u="$u $v" ;;
        esac
    done
    echo "_paste_env() { env $u \"\$@\"; }"
}
# This job's arm. Not exported: a job that does not source this file (the
# sl_comparison jobs) derives them from PCA_ARM itself, so a value inherited
# from the orchestrator's own arm can never stand in for the job's.
RESULTS_ROOT=$(pca_arm_results "$PCA_ARM")
STEP1_ROOT=$(pca_arm_results "$(pca_step1_arm "$PCA_ARM")")
CMP_ROOT=$(pca_arm_cmp "$PCA_ARM")
PCA_MULTI_ARGS=$(pca_multi_args "$PCA_ARM")
PCA_SINGLE_ARGS=$(pca_single_args "$PCA_ARM")

# --- Preprocessing fit scope ---
# Controls which gene rows fit the preprocessing statistics (impute locations,
# PCA basis, normalization center/scale), PER FOLD. The estimators are set by
# PCA_METHOD below: mean/std + classical SVD under the default "plain",
# Huber / ROBPCA / median-MAD under "robust".
#   "train" (default, leak-free): training-pair genes (pos or neg) + genes in
#                                 no pair; genes seen only in val or test
#                                 pairs are excluded, in every CV type (CV1
#                                 included).
#   "all"  (legacy, leaky):       every gene, regardless of fold.
# Use "all" only for A/B comparison to quantify the effect of the per-fold
# fit over the old shared-all-gene fit. Threaded into every train.py call
# in the benchmark + best-per-category + combo SLURM scripts.
# Overridable via env var (e.g., `PREPROCESSING_FIT_SCOPE=all sbatch ...`).
PREPROCESSING_FIT_SCOPE="${PREPROCESSING_FIT_SCOPE:-train}"

# --- PCA method ---
# Selects the ENTIRE preprocessing pipeline (not just PCA itself).
#   "plain" (default): mean-impute → per-column mean+std standardize → SVD →
#       global mean/std normalize. All classical measures.
#   "robust": Huber-impute → ROBPCA (with median-centered-SVD fallback) →
#       global median/MAD normalize. All robust measures.
#   "svd": matrix-wise global-scalar normalize → median-centered SVD; no
#       per-column standardize, no ROBPCA.
# "plain" is the default as of 2026-08-10: one classical pipeline everywhere,
# so no result depends on which of three preprocessing regimes a given job
# happened to inherit. "robust"/"svd" remain available to reproduce earlier
# runs or to A/B the outlier filtering.
# Overridable via env var (e.g., `PCA_METHOD=robust sbatch ...`).
PCA_METHOD="${PCA_METHOD:-plain}"

# --- Cross-validation types ---
# cv1: edge split, cv2: gene split, cv3: pair split (hardest)
CV_TYPES=("cv1" "cv2" "cv3")

