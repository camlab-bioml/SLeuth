# ============================================================================
# Compute-node setup (only inside SLURM jobs)
# ============================================================================
# Skipped when sourced from the login node (submit_pipeline.sh), where
# SLURM_JOB_ID is not set. This avoids module-load and nvidia-smi errors.

if [ -n "$SLURM_JOB_ID" ]; then
    module purge
    module load gnu15 openmpi5 EasyBuild cmake openblas fftw

    cd "$WORK_DIR"

    echo "============================================================================"
    echo "Job: $SLURM_JOB_NAME | ID: $SLURM_JOB_ID | Node: ${SLURM_NODELIST:-$(hostname)}"
    if [ -n "$SLURM_ARRAY_TASK_ID" ]; then
        echo "Array task: $SLURM_ARRAY_TASK_ID (of job $SLURM_ARRAY_JOB_ID)"
    fi
    # A job of every arm (run_generate_embeddings.sh sets PCA_EVERY_ARM=1,
    # not exported, before it sources this file) names the run's arms, not
    # the PCA_ARM it inherits from the orchestrator (none, config.conf's
    # default) and that arm's results root: its log said "PCA arm: none (no
    # PCA) | results: results/" even in a run without arm none (2026-10-21).
    if [ -n "${PCA_EVERY_ARM:-}" ]; then
        echo "PCA arms: $PCA_ARMS (a job shared by every arm: no arm's results root)"
    else
        echo "PCA arm: $PCA_ARM ($(pca_arm_label "$PCA_ARM")) | results: $RESULTS_ROOT/"
    fi
    echo "Start: $(date)"
    nvidia-smi --query-gpu=name,memory.total,memory.used --format=csv,noheader 2>/dev/null || true
    echo "============================================================================"
    echo ""
fi
