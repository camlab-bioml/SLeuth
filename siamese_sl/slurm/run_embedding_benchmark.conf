# ============================================================================
# Configuration for the Embedding Benchmark Pipeline
# ============================================================================
# Sourced by:
#   - submit_pipeline.sh                  (to compute array size)
#   - run_embedding_benchmark.sh          (array worker)
#   - run_embedding_benchmark_summary.sh  (collects results)
#
# All training hyperparameters, CV_TYPES, and ALL_EMBEDDINGS come from
# config.conf (sourced before this file). Override any shared value below
# if the benchmark pipeline needs different settings than best-per-category.
# ============================================================================

# No overrides — uses shared defaults from config.conf.
# To tune independently, uncomment and edit:
# EPOCHS=2000
# LR=0.001

# --- Preprocessing fit scope ---
# Inherits PREPROCESSING_FIT_SCOPE from config.conf ("train" by default —
# per-fold fit on training-pair + non-SL genes; leak-free). Uncomment to
# override just for the benchmark pipeline (e.g., A/B-test the legacy
# all-gene fit against the leak-free default):
# PREPROCESSING_FIT_SCOPE="all"

# --- PCA method ---
# Inherits PCA_METHOD from config.conf ("robust" by default — ROBPCA with
# outlier filtering). Uncomment to force plain median-centered SVD here
# (e.g., A/B-test outlier filtering's effect):
# PCA_METHOD="plain"
