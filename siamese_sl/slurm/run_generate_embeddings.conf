# ============================================================================
# Configuration for run_generate_embeddings.sh
# ============================================================================
# Embedding types to download/generate. ESM-2 and GO are generated by
# dedicated steps in the job script; these are the types handled by
# generate_embeddings.py.
#
# ALL_EMBEDDINGS (the complete type:filename:display_name catalog) comes from
# config.conf, which is sourced before this file.
# ============================================================================

# PRECOMPUTED_TYPES
# Type: bash array of strings
# Embedding types to generate via generate_embeddings.py.
# Each type auto-downloads its source data into CACHE_DIR on first run.
# ESM-2 and GO are generated separately (dedicated steps in the job script).
# Example: to generate only PPI embeddings, set to ("node2vec_ppi" "ppi_svd" "mashup")
PRECOMPUTED_TYPES=(
    # Expression-based (single-cell foundation models)
    "geneformer"      # Geneformer-V2-316M token embeddings (1152d; pinned HF root-model revision)
    "scgpt"           # scGPT token embeddings (512d)
    "gene2vec"        # Gene2Vec co-expression skip-gram (200d)
    # Protein sequence (PLMs -- GPU-heavy, hours for ~20k proteins)
    "prot_t5"         # ProtT5-XL T5-based PLM (1024d)
    "esm1b"           # ESM-1b predecessor to ESM-2 (1280d)
    # "esmc"          # ESM Cambrian 600M (1152d, via Synthyra/ESMplusplus_large).
    #                 # Not generated: the paper selects over its 16 single-modality
    #                 # embeddings (its run had no ESM-C file, "16 val" candidates),
    #                 # and a build that works in a fresh venv would add a 17th
    #                 # protein_seq candidate the combo ranks. Uncomment to rank it.
    "scprint"         # scPRINT ESM2-derived gene IDs (auto dim, needs manual checkpoint)
    "seqvec"          # SeqVec ELMo-style (1024d, needs allennlp)
    # Text / literature
    "genept"          # GenePT GPT-3.5 text embeddings (1536d, DATA LEAKAGE with SL)
    "text_embed"      # mxbai-embed-large on NCBI gene descriptions (1024d, no leakage)
    "bioconceptvec"   # BioConceptVec PubMed concept embeddings (100d)
    # PPI network (STRING v12.0, auto-downloaded)
    "node2vec_ppi"    # Node2Vec random walks on PPI (128d)
    "ppi_svd"         # Truncated SVD of PPI adjacency (256d)
    "ppi_raw"         # Higher-dim SVD of PPI adjacency (1024d, strong baseline)
    "mashup"          # Mashup (Cho et al.): RWR + log(Q+1/n) + SVD (500d)
    # Gene Ontology (GO OBO + human GAF, auto-downloaded)
    "go2vec"          # Node2Vec on GO DAG, mean-pooled per gene (128d)
    "onto2vec"        # Word2Vec on GO axiom sentences, mean-pooled (128d)
    # Knowledge graph
    "kg_complex"      # ComplEx on STRING PPI + GO annotation triples (512d, real⊕imag, needs pykeen)
)

# OPTIONAL_TYPES
# Type: bash array of strings
# Types whose absence is accepted: none of them is among the paper's 16
# single-modality embeddings (ESM-C is not generated, see above; scPRINT needs
# a manual checkpoint, SeqVec needs allennlp; GenePT is not in EMB_CATALOG).
# Any OTHER EMB_CATALOG type still missing after one retry fails the job at the
# end: Step 1 would SKIP it with exit 0 and the combo would select over a
# smaller catalog, i.e. train another model than the paper's (in the root DAG
# the failure also cancels the shared models, which hang off this job afterok).
# List a type here to accept its absence on purpose.
OPTIONAL_TYPES=("esmc" "scprint" "seqvec" "genept")
