# ============================================================================
# Configuration for the Best-per-Category Pipeline
# ============================================================================
# PCA settings and embedding catalog for best-per-category multi-modal
# training. Sourced by:
#   - submit_pipeline.sh              (to compute array size from EMB_CATALOG/CV_TYPES)
#   - run_best_per_category.sh        (array worker — trains one embedding×CV with PCA)
#   - run_best_per_category_combo.sh  (selects winners + trains multi-modal combos)
#
# Training hyperparameters, CV_TYPES, and ALL_EMBEDDINGS come from config.sh
# (sourced before this file). Override any shared value below if this pipeline
# needs different settings than the embedding benchmark.
#
# Adding/removing entries in EMB_CATALOG or CV_TYPES automatically adjusts
# the SLURM array size — no other script changes needed.
# ============================================================================

# --- PCA ---

# PCA_VARIANCE
# Type: float in (0, 1)
# Target fraction of variance to explain per modality via robust PCA.
# Each modality gets as many components as needed to reach this threshold,
# so high-dimensional embeddings may keep more components than low-dimensional
# ones. E.g., 0.8 means each modality retains enough PCs for 80% variance.
# Override at submit time: BEST_CAT_PCA_VARIANCE=0.9 ./slurm/submit_pipeline.sh --best-cat-only
PCA_VARIANCE="${BEST_CAT_PCA_VARIANCE:-0.8}"

# --- Embedding catalog ---

# EMB_CATALOG
# Type: bash array of colon-separated strings "type:filename:category"
# Maps each embedding type to its .pt file (relative to DATA_DIR) and its
# biological category. Used to:
#   1. Train each embedding individually with PCA
#   2. Pick the best AUROC embedding per category per CV
#   3. Concatenate the winners into a multi-modal combo
# Categories: expression, protein_seq, text, ppi, go, kg
# genept is excluded due to data leakage with SL labels.
EMB_CATALOG=(
    # Expression
    "geneformer:all_genes_geneformer.pt:expression"
    "scgpt:all_genes_scgpt.pt:expression"
    "gene2vec:all_genes_gene2vec.pt:expression"
    # Protein sequence
    "esm2:all_genes_esm2.pt:protein_seq"
    "esm1b:all_genes_esm1b.pt:protein_seq"
    "esmc:all_genes_esmc.pt:protein_seq"
    "prot_t5:all_genes_prot_t5.pt:protein_seq"
    "scprint:all_genes_scprint.pt:protein_seq"
    "seqvec:all_genes_seqvec.pt:protein_seq"
    # Text / literature (genept excluded -- data leakage)
    "text_embed:all_genes_text_embed.pt:text"
    "bioconceptvec:all_genes_bioconceptvec.pt:text"
    # PPI network
    "node2vec_ppi:all_genes_node2vec_ppi.pt:ppi"
    "ppi_svd:all_genes_ppi_svd.pt:ppi"
    "ppi_raw:all_genes_ppi_raw.pt:ppi"
    "mashup:all_genes_mashup.pt:ppi"
    # Gene Ontology
    "go:all_genes_go.pt:go"
    "go2vec:all_genes_go2vec.pt:go"
    "onto2vec:all_genes_onto2vec.pt:go"
    # Knowledge graph
    "kg_complex:all_genes_kg_complex.pt:kg"
)
