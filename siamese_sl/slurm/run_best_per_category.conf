# ============================================================================
# Configuration for the Best-per-Category Pipeline
# ============================================================================
# Preprocessing settings and embedding catalog for best-per-category
# multi-modal training. Sourced by:
#   - submit_pipeline.sh              (to compute array size from EMB_CATALOG/CV_TYPES)
#   - run_best_per_category.sh        (array worker — trains one embedding×CV, PCA arm's single-embedding PCA)
#   - run_best_per_category_combo.sh  (selects winners + trains multi-modal combos)
#
# Training hyperparameters, CV_TYPES, and ALL_EMBEDDINGS come from config.conf
# (sourced before this file). Override any shared value below if this pipeline
# needs different settings than the embedding benchmark.
#
# Adding/removing entries in EMB_CATALOG or CV_TYPES automatically adjusts
# the SLURM array size. That is all it adjusts: a NEW embedding type also needs
# a builder in generate_embeddings.py plus an entry in PRECOMPUTED_TYPES (or, to
# accept its absence, in OPTIONAL_TYPES) in run_generate_embeddings.conf, and an
# entry in config.conf's ALL_EMBEDDINGS (the generation job's cleanup and the
# Stage-2 benchmark iterate that list). Without them run_generate_embeddings.sh
# exits 1 at the END of a multi-hour job for a catalog type nothing built,
# cancelling every afterok job behind it. A new CATEGORY also needs an entry in
# ABLATE_CATEGORIES (run_ablation.conf). See slurm/README.md "Customization".
# ============================================================================

# --- PCA ---

# PCA_VARIANCE
# Type: float in (0, 1)
# A legacy DIRECTORY TAG, not a PCA setting. The PCA a Step-1 single-embedding
# run trains with is its PCA arm's (config.conf, pca_single_args): native
# dimension (--no_post_pca) in arms none and joint, --pca_variance
# PCA_MODALITY_VARIANCE in per_modality and both. PCA_VARIANCE only names the
# <arm root>/pcavar<value>_<type>_<cv> directories that the combo selection,
# run_ablation_summary.sh and paper_tables read, so BEST_CAT_PCA_VARIANCE=0.9
# trains the same models under pcavar0.9_* names.
PCA_VARIANCE="${BEST_CAT_PCA_VARIANCE:-0.8}"

# PREPROCESSING_FIT_SCOPE
# Type: "train" | "all"
# Which gene rows fit the preprocessing statistics (impute locations, PCA
# basis, normalization center/scale), PER FOLD; the estimators are set by
# PCA_METHOD below (mean/std + classical SVD under the default "plain",
# Huber / ROBPCA / median-MAD under "robust").
#   "train" — training-pair genes (pos or neg) + genes in no pair. Genes seen
#             only in val or test pairs are excluded (CV1 included), so their
#             embeddings cannot shape the fit — closes the held-out-gene
#             leakage path. Default.
#   "all"   — every gene, regardless of fold. Matches the pre-refactor
#             legacy pipeline. Use ONLY for A/B comparison.
# Defaults to config.conf's value; override at submit time:
#   PREPROCESSING_FIT_SCOPE=all bash slurm/submit_pipeline.sh --best-cat-only
PREPROCESSING_FIT_SCOPE="${PREPROCESSING_FIT_SCOPE:-train}"

# PCA_METHOD
# Type: "plain" | "robust" | "svd"
#   "plain"  — mean-impute + mean/std standardize + SVD + mean/std
#              normalize (all classical).
#   "robust" — Huber-impute + ROBPCA + median/MAD normalize (all robust).
#   "svd"    — matrix-wise normalize + median-centered SVD, no standardize.
# Selects the WHOLE preprocessing pipeline — not just the PCA algorithm.
# Was "svd" here while config.conf said "robust"; both are now "plain" so the
# combo and the per-embedding benchmark are preprocessed identically and a
# category winner is not partly an artifact of its job's pipeline.
# Override at submit time:
#   PCA_METHOD=robust bash slurm/submit_pipeline.sh --best-cat-only
PCA_METHOD="${PCA_METHOD:-plain}"

# SELECTION_CV
# Type: "cv1" | "cv2" | "cv3"
# Which single-embedding CV scores drive per-category winner selection. The
# same winners are then used to train ALL CV combos (cv1, cv2, cv3).
# Selection metric (matches train.py's checkpoint metric): the VALIDATION
# score val_<select_metric>_mean (train.py --select_metric, auprg_any by
# default) in both modes; single-output runs write the same keys. AUPRG is more
# sensitive to the rare-positive head of the ranking on this class-imbalanced
# task than AUROC.
# Default "cv1": winners are ranked on SELECTION_CV VALIDATION scores only, so
# no split's test metric picks them. This is NOT leakage-free for any combo:
# the five cv1 folds' training and validation pairs together cover every pair
# (cv1 is a KFold over pairs), so the test pairs of every cv1/cv2/cv3 fold
# reach the modality choice through other folds' runs (accepted and
# disclosed; see run_best_per_category_combo.sh Step 2). A leakage-free
# version would select per (CV, fold) on that fold's own validation split.
# The prior default (per-CV selection) was
# circular for cv2/cv3: the same test split that picked the winners then
# validated their combo.
# Override at submit time:
#   SELECTION_CV=cv2 bash slurm/submit_pipeline.sh --best-cat-only
SELECTION_CV="${SELECTION_CV:-cv1}"
# One of CV_TYPES (config.conf, sourced before this file), compared element by
# element: both orchestrators source this file before they change anything, so
# a mistyped value stops there instead of in the combo's Step 2, after the
# whole Step-1 array has trained.
_sel_cv_ok=0
for _c in "${CV_TYPES[@]}"; do
    if [ "$_c" = "$SELECTION_CV" ]; then _sel_cv_ok=1; fi
done
if [ "$_sel_cv_ok" != 1 ]; then
    echo "ERROR: SELECTION_CV='$SELECTION_CV' is not one of CV_TYPES (${CV_TYPES[*]})" >&2
    unset _sel_cv_ok _c
    return 1
fi
unset _sel_cv_ok _c

# --- Embedding catalog ---

# EMB_CATALOG
# Type: bash array of colon-separated strings "type:filename:category"
# Maps each embedding type to its .pt file (relative to DATA_DIR) and its
# biological category. Used to:
#   1. Train each embedding individually (native dim, or per-modality PCA in arms per_modality / both)
#   2. Pick the best embedding per category ONCE, on SELECTION_CV, by
#      VALIDATION val_<select_metric>_mean (auprg_any by default)
#   3. Concatenate the winners into a multi-modal combo (every CV and variant)
# Categories: expression, protein_seq, text, ppi, go, kg
# genept is excluded due to data leakage with SL labels.
# Kept, but NOT label-free (a smaller GenePT-like risk; excluding them is a
# policy call): bioconceptvec is PubMed concept co-occurrence, so genes
# co-mentioned in SL papers sit closer; the STRING graph behind the ppi
# embeddings and kg_complex (combined_score >= 700) includes STRING's
# text-mining channel. Which of them a combo used is in its PCA arm's
# <arm root>/best_per_category.json (config.conf RESULTS_ROOT: results/ for
# arm none, results/pca_<arm>/ otherwise).
EMB_CATALOG=(
    # Expression
    "geneformer:all_genes_geneformer.pt:expression"
    "scgpt:all_genes_scgpt.pt:expression"
    "gene2vec:all_genes_gene2vec.pt:expression"
    # Protein sequence
    "esm2:all_genes_esm2.pt:protein_seq"
    "esm1b:all_genes_esm1b.pt:protein_seq"
    "esmc:all_genes_esmc.pt:protein_seq"
    "prot_t5:all_genes_prot_t5.pt:protein_seq"
    "scprint:all_genes_scprint.pt:protein_seq"
    "seqvec:all_genes_seqvec.pt:protein_seq"
    # Text / literature (genept excluded -- data leakage)
    "text_embed:all_genes_text_embed.pt:text"
    "bioconceptvec:all_genes_bioconceptvec.pt:text"
    # PPI network
    "node2vec_ppi:all_genes_node2vec_ppi.pt:ppi"
    "ppi_svd:all_genes_ppi_svd.pt:ppi"
    "ppi_raw:all_genes_ppi_raw.pt:ppi"
    "mashup:all_genes_mashup.pt:ppi"
    # Gene Ontology
    "go:all_genes_go.pt:go"
    "go2vec:all_genes_go2vec.pt:go"
    "onto2vec:all_genes_onto2vec.pt:go"
    # Knowledge graph
    "kg_complex:all_genes_kg_complex.pt:kg"
)

# --- Single-modality runs of the other variants (reporting only) ---

# BESTCAT_EXTRA_VARIANTS
# Type: 0 | 1 (default 1 since 2026-11-13)
# 1 also trains every catalog embedding x CV under each SIAMESE_VARIANTS entry
# other than SELECTION_VARIANT, in the SAME Step-1 array, for the per-variant
# single-modality table. Those runs are never ranked: the combo's Step 2 reads
# only the unprefixed SELECTION_VARIANT directories, so the modality selection
# is unchanged. They write <owner root>/<solo prefix>pcavar<v>_<type>_<cv>
# (bestcat_solo_prefix), in the single-embedding root of the array's PCA arm
# pair (config.conf STEP1_ROOT: the results root of the first arm of (none,
# joint) or (per_modality, both) that PCA_ARMS lists, pca_step1_arm), and
# drop their prediction matrices and checkpoints once results.json exists
# (BESTCAT_X_KEEP_PREDICTIONS=1 keeps them; kept, the 3 variants x 57 runs x
# 5 folds cost ~270 GB per Step-1 array, one per pair of arms). The combo job
# waits for the whole array, so 1 about quadruples the Step-1 wall time
# before any combo.
# Revision default (2026-11-13): 1, single-embedding runs for every variant.
BESTCAT_EXTRA_VARIANTS="${BESTCAT_EXTRA_VARIANTS:-1}"
case "$BESTCAT_EXTRA_VARIANTS" in
    0|1) ;;
    *) echo "ERROR: BESTCAT_EXTRA_VARIANTS must be 0 or 1, got '$BESTCAT_EXTRA_VARIANTS'" >&2
       return 1 ;;
esac

# bestcat_task_variants: sets the array BESTCAT_TASK_VARIANTS, one variant per
# block of |EMB_CATALOG| x |CV_TYPES| Step-1 tasks. Block 0 is always
# SELECTION_VARIANT, so the default array (one block) keeps its layout.
bestcat_task_variants() {
    local v
    BESTCAT_TASK_VARIANTS=("$SELECTION_VARIANT")
    if [ "$BESTCAT_EXTRA_VARIANTS" = "1" ]; then
        for v in "${SIAMESE_VARIANTS[@]}"; do
            [ "$v" = "$SELECTION_VARIANT" ] || BESTCAT_TASK_VARIANTS+=("$v")
        done
    fi
}

# bestcat_n_tasks: the Step-1 array size for the current env; every launcher
# sizes --array=0-$(( $(bestcat_n_tasks) - 1 )) with it.
bestcat_n_tasks() {
    bestcat_task_variants
    echo $(( ${#BESTCAT_TASK_VARIANTS[@]} * ${#EMB_CATALOG[@]} * ${#CV_TYPES[@]} ))
}

# bestcat_solo_prefix VARIANT -> the directory-name prefix of VARIANT's
# single-modality runs in STEP1_ROOT: "" for SELECTION_VARIANT (the
# directories Step 2 ranks), else siamese_variant_prefix, and
# var_pd_per_head__ for pd:per_head when it is not the selection variant, so
# it cannot overwrite the selection runs.
bestcat_solo_prefix() {
    local p
    [ "$1" = "$SELECTION_VARIANT" ] && { echo ""; return; }
    p=$(siamese_variant_prefix "$1")
    echo "${p:-var_pd_per_head__}"
}
