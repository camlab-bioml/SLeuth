# ============================================================================
# ALL CONFIG FILES IN THIS DIRECTORY USE THE .conf EXTENSION BY PROJECT
# CONVENTION, EVEN THOUGH THEY ARE PLAIN BASH FILES THAT BASH SOURCES
# DIRECTLY. THE EXTENSION IS COSMETIC — BASH IGNORES IT ENTIRELY.
# ============================================================================
# Configuration for eval_finetuning.sh / eval_finetuning.py
# ============================================================================
# Evaluates a pretrained multi-modal siamese SL model against three external
# CRISPR / Perturb-seq screens (Adamson, Corn, Gilbert), then fine-tunes with
# an (a, c) affine head + MSE regression and reports held-out metrics.
#
# Sourced by:
#   - eval_finetuning.sh  (SLURM worker)
#   - submit_pipeline.sh  (in a SUBSHELL only, to count EVAL_CV_TYPES for the
#                          array size — it never sources this file into its own
#                          environment, so nothing set here reaches the job
#                          except via the job's own source at eval_finetuning.sh)
#
# Shared settings (PYTHON_PATH, DATA_DIR, BASE_DIR, SL_PATH) come from
# config.conf, which is sourced before this file.
# ============================================================================

# --- Pretrained combo to evaluate ---

# MODEL_DIR
# Type: string (path; relative to siamese_sl/ or absolute)
# Resolution order (first match wins):
#   1. EVAL_MODEL_DIR env var      — explicit override
#   2. results/latest_combo_cv3.txt — marker file written by
#         run_best_per_category_combo.sh after a successful CV3 combo.
#         This is how the chained pipeline (submit_pipeline.sh → combo →
#         eval) locates the freshly-trained combo without the caller
#         knowing its exact name.
#   3. hardcoded fallback          — a legacy SINGLE-OUTPUT reference combo.
#         NOTE: non-cell-line — valid only with PER_HEAD=false. Unreachable in
#         the default chained run (eval runs afterok:combo, which writes the #2
#         marker on success). If hit with PER_HEAD=true it errors clearly at
#         load (checkpoint has no cell_emb.weight).
# Must contain config.json, results.json, and checkpoints/fold_{0..4}_best.pt.
if [ -n "${EVAL_MODEL_DIR:-}" ]; then
    MODEL_DIR="$EVAL_MODEL_DIR"
elif [ -f "results/latest_combo_cv3.txt" ]; then
    MODEL_DIR=$(cat "results/latest_combo_cv3.txt")
    echo "[eval_finetuning.conf] MODEL_DIR resolved from marker: $MODEL_DIR"
else
    MODEL_DIR="results/best_cat_geneformer_go2vec_kg_complex_ppi_svd_esm1b_bioconceptvec_cv3"
fi

# --- Embeddings for the pretrained model ---
# By default eval_finetuning.sh auto-resolves these from
# $MODEL_DIR/config.json["embeddings_paths"] and rebases each filename under
# $DATA_DIR, so the list tracks whichever modalities the combo was trained
# on (category winners change across reruns).
#
# To override, populate EMBEDDINGS_PATHS with an explicit list — the script
# skips auto-resolution whenever the array is non-empty. The entries MUST
# match MODEL_DIR/config.json["embeddings_paths"] (same order, same files),
# or apply_multimodal_transform will dim-mismatch against the checkpoint's
# fitted preprocessing_transform.
EMBEDDINGS_PATHS=()

# --- PCA (legacy fallback only) ---
# New checkpoints store their own per-fold `preprocessing_transform` and
# ignore these values entirely. They are used ONLY when a checkpoint predates
# the per-fold fit/apply refactor — in that case eval_finetuning.py fits a
# single all-gene PCA with these variances and warns loudly about the
# resulting CV2/CV3 leakage. Retrain to remove the warning.
PCA_VARIANCE=0.8
POST_PCA_VARIANCE=0.8

# --- External datasets ---
# Each row: "name:file:column:sign:format[:head]"
#   name    — short label used for output files
#   file    — path relative to BASE_DIR
#   column  — outcome variable in the file
#   sign    — +1 or -1. Sign convention: high logit = high SL-ness. For all
#             three screens SL-like = negative raw score, so sign = -1 means
#             "fine-tune target = sign * raw_score = -raw_score", keeping the
#             pretrained direction intact.
#   format  — tsv, csv, or xlsx (how to read the file)
#   head    — OPTIONAL 6th field: which cell-line head scores this dataset when
#             PER_HEAD=true (cell-line-conditioned SiameseSLMultiCell). Must be
#             one of cell_line_vocab.HEADS (K562, JURKAT, A549, HELA, A375,
#             293T, PC9, OTHER). Ignored when PER_HEAD is off.
#             Screen cell lines: Adamson=K562 (CRISPRi), Gilbert=K562 (K562_avg
#             column), Corn=RPE-1 -> OTHER (RPE-1 is not a named head, so it
#             folds into the OTHER catch-all — treat that row as diagnostic).
#
# Adamson: Gamma only (Tau/Rho available in the same file — skipped per spec).
# Paths use "external data" (with the literal space) exactly as on disk.
DATASETS=(
    "Adamson:external data/pair_sgRNA_phenotypes.txt:Gamma:-1:tsv:K562"
    "Corn:external data/41586_2025_8815_MOESM5_ESM.csv:sens.score:-1:csv:OTHER"
    "Gilbert:external data/mmc5.xlsx:K562_avg:-1:xlsx:K562"
)

# --- SynLethDB overlap reporting ---
# When true, the script reports metrics both with and without pairs that also
# appear in SynLethDB positives (leakage-filtered secondary report).
REPORT_SLDB_FILTERED=true

# --- Per-head (cell-line-conditioned) evaluation ---
# When true, evaluate a SiameseSLMultiCell checkpoint (trained with
# USE_CELL_LINES=1) by scoring each dataset against the model head named in its
# DATASETS `head` field above (Adamson/Gilbert -> K562, Corn -> OTHER).
# Defaults to track USE_CELL_LINES (sourced from config.conf, which precedes
# this file): per-head eval is auto-enabled exactly when the pipeline trained
# cell-line-conditioned models. Override explicitly via the PER_HEAD env var.
if [ "${USE_CELL_LINES:-0}" = "1" ]; then
    PER_HEAD="${PER_HEAD:-true}"
else
    PER_HEAD="${PER_HEAD:-false}"
fi

# --- Fine-tuning ---
# Modes run for each dataset × fold. Zero-shot (closed-form OLS of (a, c))
# is always computed — no need to list it here. The (a, c) affine head is
# always present and trainable in every SGD mode; modes differ only in
# which additional parameters are unfrozen.
#   LP_last — (a, c) + last projection layer (encoder.projection)
#   Full    — (a, c) + entire encoder
FT_MODES=("LP_last" "Full")

FT_EPOCHS=100
FT_PATIENCE=10          # epochs without val-R² improvement before early stop
FT_LR=1e-4
FT_BATCH_SIZE=256
FT_WEIGHT_DECAY=0.0     # No weight decay — fine-tuning, not regularization.

# --- Data split (shared across folds, seed-fixed) ---
# EVAL_CV_TYPES: which CV split strategies to apply to the EXTERNAL data.
# IMPORTANT: this controls how the external dataset's pairs are split into
# train/val/test for the OLS calibration + fine-tuning step — it does NOT
# select which pretrained combo gets loaded. The source combo is always the
# cv3-trained one (resolved from results/latest_combo_cv3.txt; see MODEL_DIR
# above). So `EVAL_CV_TYPES=("cv1" "cv2" "cv3")` means "evaluate the cv3
# combo against the external data under three increasingly hard splits."
#   cv1 = edge-based (random pair split — both genes may appear in train)
#   cv2 = gene-based (test pairs have >= 1 unseen gene)
#   cv3 = pair-based (both genes in each test pair are unseen; mixed pairs
#         discarded)
# eval_finetuning.sh loops over all entries, producing one output dir per
# type: $MODEL_DIR/eval_finetuning_{cv1,cv2,cv3}/.
EVAL_CV_TYPES=("cv1" "cv2" "cv3")

# TRAIN_FRAC has different semantics per CV type:
#   cv1: fraction of PAIRS that become train+val; test = 1 - TRAIN_FRAC.
#        With VAL_FRAC=0.1 the result is the documented 72/8/20 pair ratio.
#   cv2/cv3: fraction of GENES that become "training genes." Resulting pair
#        ratios depend on the gene-pair density in the dataset (typically
#        ~57/6/36 for cv2, ~57/6/4 with 32% discarded for cv3 at 80/10).
TRAIN_FRAC=0.8          # train+val fraction (CV1: of pairs; CV2/CV3: of genes)
VAL_FRAC=0.1            # fraction of the TRAIN_FRAC pool held out as val
SPLIT_SEED=42           # governs split + affine init + dataloader shuffle
