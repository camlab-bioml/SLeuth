# ============================================================================
# ALL CONFIG FILES IN THIS DIRECTORY USE THE .conf EXTENSION BY PROJECT
# CONVENTION, EVEN THOUGH THEY ARE PLAIN BASH FILES THAT BASH SOURCES
# DIRECTLY. THE EXTENSION IS COSMETIC — BASH IGNORES IT ENTIRELY.
# ============================================================================
# Configuration for eval_finetuning.sh / eval_finetuning.py
# ============================================================================
# Evaluates a pretrained multi-modal siamese SL model against three external
# CRISPR / Perturb-seq screens (Adamson, Corn, Gilbert), then fine-tunes with
# an (a, c) affine head + MSE regression and reports held-out metrics.
#
# Sourced by:
#   - eval_finetuning.sh  (SLURM worker)
#   - submit_pipeline.sh  (in a SUBSHELL only, to count EVAL_CV_TYPES for the
#                          array size — it never sources this file into its own
#                          environment, so nothing set here reaches the job
#                          except via the job's own source at eval_finetuning.sh)
#
# Shared settings (PYTHON_PATH, DATA_DIR, BASE_DIR, SL_PATH) come from
# config.conf, which is sourced before this file.
# ============================================================================

# --- Pretrained combo to evaluate ---

# EVAL_VARIANT
# Type: one SIAMESE_VARIANTS entry "KERNEL:CELL_LINES" (config.conf)
# Whose cv3 combo to evaluate. Set per array task by eval_finetuning.sh (the
# chained array covers every variant); defaults to the baseline pd:per_head for
# a bare `sbatch slurm/eval_finetuning.sh`. Ignored when EVAL_MODEL_DIR is set.
# A pooled checkpoint has one head, which scores every screen whatever the
# DATASETS `head` field says (eval_finetuning._load_eval_base).
EVAL_VARIANT="${EVAL_VARIANT:-pd:per_head}"
# "" for the baseline -> <arm root>/latest_combo_cv3.txt, the historical marker,
# in the PCA arm's results root (config.conf RESULTS_ROOT: results/ for arm
# none, results/pca_<arm>/ otherwise; PCA_ARM picks the arm).
EVAL_PREFIX=$(siamese_variant_prefix "$EVAL_VARIANT" 2>/dev/null || true)
EVAL_MARKER="$RESULTS_ROOT/${EVAL_PREFIX}latest_combo_cv3.txt"

# MODEL_DIR
# Type: string (path; relative to siamese_sl/ or absolute)
# Resolution order (first match wins):
#   1. EVAL_MODEL_DIR env var      — explicit override
#   2. $EVAL_MARKER                — marker file written by
#         run_best_per_category_combo.sh after a successful CV3 combo of
#         EVAL_VARIANT in the job's PCA arm (<arm root>/latest_combo_cv3.txt
#         for the baseline, <arm root>/var_<kernel>_<cell_lines>__latest_combo_cv3.txt
#         otherwise).
#         This is how the chained pipeline (submit_pipeline.sh → combo →
#         eval) locates the freshly-trained combo without the caller
#         knowing its exact name.
# There is NO fallback, for any variant: with no EVAL_MODEL_DIR and no marker
# (the combo failed, is still running, or never ran) MODEL_DIR stays empty and
# eval_finetuning.sh stops. The former hardcoded baseline fallback named a
# legacy single-output combo that no longer exists; the only directory that
# could still carry its name is this run's own combo, crashed or unfinished.
# Must contain config.json, results.json (train.py writes it only after every
# fold saved checkpoints/fold_<k>_best.pt); eval_finetuning.sh checks both.
if [ -n "${EVAL_MODEL_DIR:-}" ]; then
    MODEL_DIR="$EVAL_MODEL_DIR"
elif [ -f "$EVAL_MARKER" ]; then
    MODEL_DIR=$(cat "$EVAL_MARKER")
    echo "[eval_finetuning.conf] MODEL_DIR resolved from marker $EVAL_MARKER: $MODEL_DIR"
else
    MODEL_DIR=""
fi

# --- Embeddings for the pretrained model ---
# By default eval_finetuning.sh auto-resolves these from
# $MODEL_DIR/config.json["embeddings_paths"] and rebases each filename under
# $DATA_DIR, so the list tracks whichever modalities the combo was trained
# on (category winners change across reruns).
#
# To override, populate EMBEDDINGS_PATHS with an explicit list — the script
# skips auto-resolution whenever the array is non-empty. The entries MUST
# match MODEL_DIR/config.json["embeddings_paths"] (same order, same files),
# or eval_finetuning.py refuses to run (checkpoint_input_problems compares the
# basenames, in order, and the gene order with every fold checkpoint; a legacy
# checkpoint without them dim-mismatches in apply_multimodal_transform instead,
# and a same-width swap passes that width check).
#
# The same guard also compares each file's CONTENT hash with the
# embeddings_sha256 the checkpoint recorded at training time. This matters for
# a standalone eval of an OLDER combo: `submit_pipeline.sh --benchmark-only`
# leaves generation ON, and node2vec/go2vec are not bit-for-bit reproducible,
# so a rebuilt .pt at the same path keeps its name, gene order and
# generator_version while changing every vector — the eval task then exits 1
# instead of publishing tab_external numbers off the wrong features. Pass
# --skip-generate to keep an existing combo's files.
EMBEDDINGS_PATHS=()

# --- PCA (legacy fallback only) ---
# New checkpoints store their own per-fold `preprocessing_transform` and
# ignore these values entirely. They are used ONLY when a checkpoint predates
# the per-fold fit/apply refactor — in that case eval_finetuning.py fits a
# single all-gene PCA with these variances and warns loudly about the
# resulting CV2/CV3 leakage. Retrain to remove the warning. Named LEGACY_* so
# that they can never be read as a PCA arm's setting (config.conf refuses the
# old POST_PCA_VARIANCE knob since 2026-10-20).
LEGACY_PCA_VARIANCE=0.8
LEGACY_POST_PCA_VARIANCE=0.8

# --- External datasets ---
# Each row: "name:file:column:sign:format[:head]"
#   name    — short label used for output files
#   file    — path relative to BASE_DIR
#   column  — outcome variable in the file
#   sign    — +1 or -1. Sign convention: high logit = high SL-ness. For all
#             three screens SL-like = negative raw score, so sign = -1 means
#             "fine-tune target = sign * raw_score = -raw_score", keeping the
#             pretrained direction intact.
#   format  — tsv, csv, or xlsx (how to read the file)
#   head    — OPTIONAL 6th field: which cell-line head scores this dataset when
#             PER_HEAD=true (cell-line-conditioned SiameseSLMultiCell). Must be
#             one of cell_line_vocab.HEADS (K562, JURKAT, A549, HELA, A375,
#             293T, PC9, OTHER). Ignored when PER_HEAD is off.
#             Screen cell lines: Adamson=K562 (CRISPRi), Gilbert=K562 (K562_avg
#             column), Corn=RPE-1 -> OTHER (RPE-1 is not a named head, so it
#             folds into the OTHER catch-all — treat that row as diagnostic).
#
# Adamson: Gamma only (Tau/Rho available in the same file — skipped per spec).
# Gamma is a growth phenotype of the double knockdown (~95% explained by the
# two single-gene effects), so it mostly measures single-gene essentiality.
# AdamsonGI is the SAME K562 CRISPRi screen scored as a genetic interaction:
# the published gene-level GI scores, Simpson, Ling, Jing & Adamson 2023
# (bioRxiv doi:10.1101/2023.08.19.553986, Table S3 = media-3.xlsx of the
# bioRxiv supplement, saved as external data/Simpson2023_TableS3_GI_scores.xlsx).
# Gamma.GI = observed - expected (per-query-sgRNA quadratic fit) untreated
# growth; the paper: "positive and negative scores representing buffering and
# synergistic interactions, respectively", so SL = negative GI and sign = -1.
# Both rows are reported. (Tau.GI / Nu.GI are the niraparib-treated and
# drug-modified scores in the same file.)
# Paths use "external data" (with the literal space) exactly as on disk.
DATASETS=(
    "Adamson:external data/pair_sgRNA_phenotypes.txt:Gamma:-1:tsv:K562"
    "AdamsonGI:external data/Simpson2023_TableS3_GI_scores.xlsx:Gamma.GI:-1:xlsx:K562"
    "Corn:external data/41586_2025_8815_MOESM5_ESM.csv:sens.score:-1:csv:OTHER"
    "Gilbert:external data/mmc5.xlsx:K562_avg:-1:xlsx:K562"
)

# --- SynLethDB overlap reporting ---
# When true, the script reports metrics both with and without pairs that also
# appear in SynLethDB, as an SL pair (SL_PATH) or a screened non-SL pair
# (NEG_PATH, passed as --neg_path) — the leakage-filtered secondary report.
REPORT_SLDB_FILTERED=true

# --- Per-head (cell-line-conditioned) evaluation ---
# When true, evaluate a SiameseSLMultiCell checkpoint (trained with
# USE_CELL_LINES=1) by scoring each dataset against the model head named in its
# DATASETS `head` field above (Adamson/Gilbert -> K562, Corn -> OTHER).
# Defaults to track USE_CELL_LINES (sourced from config.conf, which precedes
# this file): per-head eval is auto-enabled exactly when the pipeline trained
# cell-line-conditioned models. Override explicitly via the PER_HEAD env var.
if [ "${USE_CELL_LINES:-0}" = "1" ]; then
    PER_HEAD="${PER_HEAD:-true}"
else
    PER_HEAD="${PER_HEAD:-false}"
fi

# --- Fine-tuning ---
# Modes run for each dataset × fold. Zero-shot (closed-form OLS of (a, c))
# is always computed — no need to list it here. The (a, c) affine head is
# always present and trainable in every SGD mode; modes differ only in
# which additional parameters are unfrozen.
#   LP_last — (a, c) + last projection layer (encoder.projection) + the
#             per-head head_proj_bias when present (the default per-head c_h,
#             which replaces the projection's own bias)
#   Full    — (a, c) + entire encoder + head_proj_bias / head_input_bias /
#             kernel_A / gene_w / pair_fc1 + pair_fc2 when present (the
#             bilinear variants also adapt A; gene_w and the pair MLP are on
#             by default in all four variants)
#   Scratch — (opt-in) the from-scratch baseline: Full's trainable set,
#             optimiser, epochs and early stopping on the same architecture,
#             fold feature space and screen split, every weight freshly
#             initialised (torch seed SPLIT_SEED + 7919 + fold), none from
#             SynLethDB; (a, c) warm-started by OLS on its own initial logits.
#             Add it with FT_MODES=("LP_last" "Full" "Scratch").
# Temperature, scoring bias and cell_emb stay frozen in every mode
# (eval_finetuning.set_trainable; Scratch: frozen at their init values).
FT_MODES=("LP_last" "Full" "Scratch")

FT_EPOCHS=100
FT_PATIENCE=10          # epochs without val-R² improvement before early stop
FT_LR=1e-4
FT_BATCH_SIZE=256
FT_WEIGHT_DECAY=0.0     # No weight decay — fine-tuning, not regularization.

# --- Data split (shared across folds, seed-fixed) ---
# EVAL_CV_TYPES: which CV split strategies to apply to the EXTERNAL data.
# IMPORTANT: this controls how the external dataset's pairs are split into
# train/val/test for the OLS calibration + fine-tuning step — it does NOT
# select which pretrained combo gets loaded. The source combo is always the
# cv3-trained one (resolved from EVAL_VARIANT's latest_combo_cv3.txt marker; see
# MODEL_DIR above). So `EVAL_CV_TYPES=("cv1" "cv2" "cv3")` means "evaluate the
# cv3 combo against the external data under three increasingly hard splits."
# The chained array runs |EVAL_CV_TYPES| x |SIAMESE_VARIANTS| tasks.
#   cv1 = edge-based (random pair split — both genes may appear in train)
#   cv2 = gene-based (test pairs have >= 1 unseen gene)
#   cv3 = pair-based (both genes in each test pair are unseen; mixed pairs
#         discarded)
# eval_finetuning.sh loops over all entries, producing one output dir per
# type: $MODEL_DIR/eval_finetuning_{cv1,cv2,cv3}/.
EVAL_CV_TYPES=("cv1" "cv2" "cv3")

# TRAIN_FRAC/VAL_FRAC have different semantics per CV type:
#   cv1: both are fractions of PAIRS. TRAIN_FRAC of the pairs become
#        train+val, VAL_FRAC of THOSE become val; test = 1 - TRAIN_FRAC.
#        With 0.8/0.1 that is the documented 72/8/20 pair ratio.
#   cv2/cv3: both are fractions of GENES. TRAIN_FRAC of the genes become
#        train+val genes and VAL_FRAC of THOSE are the VAL genes, so val is
#        gene-held-out: the fine-tuning checkpoint is selected in the same
#        unseen-gene regime it is scored in (split_pairs_cv2/cv3 — the rule
#        sl_comparison/prepare_folds.py applies to the shared folds). The
#        resulting PAIR ratios are therefore not VAL_FRAC: measured on a
#        complete pair list at 0.8/0.1/seed 42, ~52/12/36 for cv2 with
#        nothing discarded and ~52/0.6/4 for cv3 with ~44% discarded (a pair
#        with exactly one val gene joins neither side).
TRAIN_FRAC=0.8          # train+val fraction (CV1: of pairs; CV2/CV3: of genes)
VAL_FRAC=0.1            # val fraction of that pool (CV1: of pairs; CV2/CV3: of genes)
SPLIT_SEED=42           # governs split + affine init + dataloader shuffle
