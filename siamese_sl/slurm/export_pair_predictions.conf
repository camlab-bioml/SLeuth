# ============================================================================
# ALL CONFIG FILES IN THIS DIRECTORY USE THE .conf EXTENSION BY PROJECT
# CONVENTION, EVEN THOUGH THEY ARE PLAIN BASH FILES THAT BASH SOURCES
# DIRECTLY. THE EXTENSION IS COSMETIC — BASH IGNORES IT ENTIRELY.
# ============================================================================
# Configuration for export_pair_predictions.sh / export_pair_predictions.py
# ============================================================================
# The all-gene-pair export: for each SLeuth variant's combo, one
# n_genes x n_genes matrix of predicted SL probability per cell-line head
# (and ANY), and the fine-tuned models' predicted screen value (Adamson Gamma)
# for all gene pairs. Post-hoc: nothing is retrained and no table reads it.
#
# Sourced by:
#   - export_pair_predictions.sh  (SLURM worker), after config.conf
#   - submit_pipeline.sh and run_benchmarking_siamese_vs_others.sh, always in
#     a subshell: to run check_pair_export (below) at submission, and to read
#     the defaults of PAIR_EXPORT_CVS, _FT_SPLITS and _FT_DATASETS for their
#     closing summary
#
# Every value below can be set in the submitting shell (the orchestrators
# submit with --export=ALL), e.g.
#   PAIR_EXPORT_UNIVERSE=shared bash run_benchmarking_siamese_vs_others.sh
#
# DISK. One matrix is n_genes^2 x 4 bytes as float32: 1.5 GB at 19,397 genes
# (universe all), 0.31 GB at 8,844 (universe shared). Per combo a cell-line
# (per_head) variant writes 8 heads + ANY = 9 matrices, a pooled variant 1,
# plus one per exported fine-tuned set. With the defaults below (the cv3
# combos of the four variants, universe all, Adamson under the cv1 screen
# split in both fine-tuning modes):
#     2 per_head x (9 + 2) + 2 pooled x (1 + 2) = 28 matrices = 42 GB.
# PAIR_EXPORT_UNIVERSE=shared brings that to 9 GB, PAIR_EXPORT_DTYPE=float16
# halves either. That is per PCA arm: the orchestrators queue one export per
# arm, each into its own combos, so the default four arms write 168 GB.
# export_pair_predictions.py refuses a combo whose matrices do not fit in the
# free space.
# ============================================================================

# PAIR_EXPORT_CVS
# Type: space-separated subset of CV_TYPES (config.conf)
# Which combos to export, by the CV they were TRAINED under: each variant's
# <arm root>/<prefix>latest_combo_<cv>.txt, in the job's PCA arm (PCA_ARM
# picks it; <arm root> is config.conf's RESULTS_ROOT, results/ for arm none,
# results/pca_<arm>/ otherwise; the orchestrators queue one export per arm).
# Default cv3 = the combos the external-screen evaluation scores and
# fine-tunes (eval_finetuning.conf MODEL_DIR). "cv1 cv2 cv3" triples the disk
# and the time, per arm.
PAIR_EXPORT_CVS="${PAIR_EXPORT_CVS:-cv3}"

# PAIR_EXPORT_UNIVERSE
# Type: all | shared
#   all     every gene of the embedding files (19,397 on the current build).
#           The only choice that covers every pair of the external screens:
#           398 of Adamson's 542 genes are in the shared 8,844, i.e. 78,985
#           of its 146,583 pairs. Every labelled pair the models were trained
#           on lies within those 8,844 genes, so a pair with a gene outside
#           them (79% of this universe's pairs) is an extrapolation from the
#           gene embeddings.
#   shared  the 8,844 genes of $SHARED_FOLDS/genes.txt, in that order: the
#           universe and order of every model's fold_<k>_<cv>_predictions.npy.
PAIR_EXPORT_UNIVERSE="${PAIR_EXPORT_UNIVERSE:-all}"

# PAIR_EXPORT_DTYPE
# Type: float32 | float16
# float16 halves the disk and keeps about 3 significant digits (it ties many
# pairs: do not rank on it).
PAIR_EXPORT_DTYPE="${PAIR_EXPORT_DTYPE:-float32}"

# PAIR_EXPORT_PER_FOLD
# Type: 0 | 1
# 1 also writes every fold model's own matrices (fold_<k>_*.npy): NUM_FOLDS
# times more disk on top. The default writes the mean over the fold models,
# which is not a held-out prediction for a labelled SynLethDB pair: each fold
# trained on about half of them under cv2 / cv3 (72% under cv1). Fold k's
# file is one for the pairs outside fold k's train and val splits
# ($SHARED_FOLDS/<cv>/fold_<k>/). Under cv3 the fold's test split is only the
# pairs with both genes unseen: one labelled pair in five over the five folds.
# The fine-tuned matrices gain nothing from it: every fold model is fine-tuned
# on the same screen split.
PAIR_EXPORT_PER_FOLD="${PAIR_EXPORT_PER_FOLD:-0}"

# PAIR_EXPORT_LOGITS
# Type: 0 | 1
# 1 also writes the fold-mean logit per head (sl_logit_<HEAD>.npy): twice the
# probability disk. float32 stores a probability above 1 - 6e-8 as exactly 1;
# the logits keep those pairs ranked (manifest.json counts the saturated
# entries of every probability matrix).
PAIR_EXPORT_LOGITS="${PAIR_EXPORT_LOGITS:-0}"

# --- Fine-tuned predicted screen values for all gene pairs -------------------
# eval_finetuning.py fine-tunes each variant's cv3 combo on every screen under
# each EVAL_CV_TYPES screen split and saves the models in
# <combo>/eval_finetuning_<split>/finetuned_models/. The export scores all
# gene pairs with them, through the head they were fine-tuned with (the
# screen's cell line on a per_head variant: K562 for Adamson).
# Only the cv3 combo has them; other PAIR_EXPORT_CVS combos export
# probabilities only.

# PAIR_EXPORT_FT_SPLITS
# Type: space-separated subset of eval_finetuning.conf EVAL_CV_TYPES, or none
# Which screen split's fine-tuned models to export. cv1 fine-tunes on the
# most screen pairs (72% of them, every gene seen); cv2 / cv3 hold genes out.
# The matrix is therefore in-sample at 80% of the screen's own pairs (72%
# fitted, 8% used to select the checkpoint): only the pairs marked
# split == test in eval_finetuning_cv1/<Screen>_finetuned_allpairs_<mode>.csv
# are held out. none = no fine-tuned matrices.
PAIR_EXPORT_FT_SPLITS="${PAIR_EXPORT_FT_SPLITS:-cv1}"

# PAIR_EXPORT_FT_DATASETS
# Type: space-separated subset of the eval_finetuning.conf DATASETS names, or all
PAIR_EXPORT_FT_DATASETS="${PAIR_EXPORT_FT_DATASETS:-Adamson}"

# PAIR_EXPORT_FT_MODES
# Type: space-separated subset of eval_finetuning.conf FT_MODES, or all
PAIR_EXPORT_FT_MODES="${PAIR_EXPORT_FT_MODES:-all}"

# PAIR_EXPORT_RAM_GB
# RAM for the fold-mean accumulators (one float32 matrix each; the defaults
# above need 11 x 1.5 = 16.5 GB for a per_head combo). A larger request is
# split into several passes over the folds, so this bounds memory, not what
# is written. Keep it about 20 GB under the job's --mem=64G: the raw
# embeddings, two matrices in transit and the CUDA runtime come on top.
PAIR_EXPORT_RAM_GB="${PAIR_EXPORT_RAM_GB:-40}"

# check_pair_export
# 0 when every PAIR_EXPORT_* value above is usable; otherwise one ERROR line
# per bad value (stderr) and 1. export_pair_predictions.sh calls it, and both
# orchestrators call it at submission, in a subshell that sources this file:
# the export is the LAST job of a run, so a mistyped value would otherwise be
# seen only after everything else. Dataset and mode NAMES are not checked
# (they are whatever eval_finetuning.conf held when the eval ran);
# export_pair_predictions.py reports a name that matches no model.
check_pair_export() {
    local rc=0 v w n
    case "$PAIR_EXPORT_UNIVERSE" in
        all|shared) ;;
        *) echo "ERROR: PAIR_EXPORT_UNIVERSE='$PAIR_EXPORT_UNIVERSE' (want all or shared)" >&2; rc=1 ;;
    esac
    case "$PAIR_EXPORT_DTYPE" in
        float32|float16) ;;
        *) echo "ERROR: PAIR_EXPORT_DTYPE='$PAIR_EXPORT_DTYPE' (want float32 or float16)" >&2; rc=1 ;;
    esac
    for v in PAIR_EXPORT_PER_FOLD PAIR_EXPORT_LOGITS; do
        case "${!v}" in
            0|1|true|false) ;;
            *) echo "ERROR: $v='${!v}' (want 0 or 1)" >&2; rc=1 ;;
        esac
    done
    case "$PAIR_EXPORT_RAM_GB" in
        ''|.|*[!0-9.]*|*.*.*) echo "ERROR: PAIR_EXPORT_RAM_GB='$PAIR_EXPORT_RAM_GB' (want a number of GB, e.g. 40)" >&2; rc=1 ;;
    esac
    # CV names: config.conf CV_TYPES = eval_finetuning.py --cv_type choices.
    for v in PAIR_EXPORT_CVS PAIR_EXPORT_FT_SPLITS; do
        if [ "$v" = PAIR_EXPORT_FT_SPLITS ] && [ "${!v}" = "none" ]; then
            continue
        fi
        n=0
        for w in ${!v}; do
            n=$((n + 1))
            case "$w" in
                cv1|cv2|cv3) ;;
                *) echo "ERROR: $v='${!v}': '$w' is not cv1, cv2 or cv3" >&2; rc=1 ;;
            esac
        done
        if [ "$n" -eq 0 ]; then
            echo "ERROR: $v is blank (want cv1, cv2 and/or cv3)" >&2; rc=1
        fi
    done
    for v in PAIR_EXPORT_FT_DATASETS PAIR_EXPORT_FT_MODES; do
        n=0
        for w in ${!v}; do
            n=$((n + 1))
            if [ "$w" = "none" ]; then
                echo "ERROR: $v='${!v}': none is not a name (PAIR_EXPORT_FT_SPLITS=none skips the fine-tuned matrices)" >&2; rc=1
            fi
        done
        if [ "$n" -eq 0 ]; then
            echo "ERROR: $v is blank (want names, or all)" >&2; rc=1
        fi
    done
    return $rc
}
