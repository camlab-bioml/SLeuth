# ============================================================================
# Configuration for the Leave-One-Category-Out Ablation
# ============================================================================
# Sourced by:
#   - submit_pipeline.sh    (to compute the array size)
#   - run_ablation.sh       (array worker — trains one ablated combo)
#   - run_ablation_summary.sh
#
# Shared training hyperparameters come from config.conf, which is sourced
# BEFORE this file, and so does the PCA: the ablation trains with the PCA arm's
# PCA_MULTI_ARGS, exactly as the reference combo did — an ablation whose
# preprocessing differs from the reference combo is not an ablation.
# run_best_per_category.conf is sourced too (EMB_CATALOG, the selection).
# ============================================================================

# --- What is ablated, and why a CATEGORY rather than an embedding -----------
#
# The combo concatenates exactly one winning embedding per biological
# category (see EMB_CATALOG in run_best_per_category.conf). Dropping a single
# EMBEDDING would only promote that category's runner-up, so the measurement
# would be "how much better is text_embed than bioconceptvec" — a question
# about two files, not about whether literature-derived signal contributes.
#
# Dropping the whole CATEGORY removes that source of biological information
# from the model entirely, which is the claim an ablation table is read as
# making. Each run therefore trains on the remaining 5 categories.
#
# ABLATE_CATEGORIES must match the category labels used in EMB_CATALOG.
ABLATE_CATEGORIES=(expression protein_seq text ppi go kg)

# --- Reference row ---------------------------------------------------------
# The full combo (all categories) is NOT retrained here: run_best_per_category_combo.sh
# already produced it at <arm root>/<prefix>best_cat_<names>_<cv>, and the
# summary script reads the directory named by <arm root>/<prefix>latest_combo_<cv>.txt
# as the baseline (<arm root> = the PCA arm's RESULTS_ROOT, config.conf). Each
# PCA arm is ablated against its own combo, never another arm's. Retraining it
# under a different job would introduce a second run of the same configuration
# and invite the two to disagree by run-to-run noise.

# --- Input width: a confound to be aware of --------------------------------
# In PCA arm none (no PCA) the encoder reads the concatenated width of the kept
# modalities. Dropping a category removes its columns, so the input width and
# the entry layer's parameter count shrink by that category's dimension; in an
# arm with a variance-target PCA the retained k is resolved on the surviving
# modalities and moves too. A performance change then confounds "this signal
# was informative" with "the model changed width". results.json records each
# fold's width as fold_metrics[].input_dim.
#
# Default: inherit config.conf, so every ablated run is preprocessed exactly
# like the reference combo of its arm and the comparison against it is
# apples-to-apples.
#
# To control for capacity instead, pin ONE width for the reference combo AND
# its ablations: an arm with the joint PCA (joint or both) at an exact count,
# PCA_JOINT_DIM=<k>, for the whole pipeline, e.g.
#   PCA_ARMS=joint PCA_JOINT_DIM=<k> bash slurm/submit_pipeline.sh --skip-reset-env --skip-generate
# (or the same exports for --best-cat-only --skip-generate and then
# --ablation-only). --skip-generate is part of the recipe: without it the run
# regenerates the embeddings, which removes EVERY arm's combo markers (their
# combos were trained on the files it replaces), the arms it leaves out included.
# config.conf turns it into --post_pca_dim <k> for the combo and every
# ablation of those arms (every job gets --export=ALL).
# k is ONE count for arms joint AND both (config.conf PCA_JOINT_DIM), and it
# must stay below the narrowest width the joint stage meets in every run that
# takes it, the ablations included: in arm both the kept modalities'
# per-modality PCA components (~1,951 for the combo on the 2026-08-11 cv1 set
# at 0.8, ~1,140 once ppi is dropped; they move per fold and CV), in arm joint
# their native concatenation (the combo's width minus the widest category).
# Since 2026-10-21 train.py refuses a count at or above it at the fold's fit
# (data_loader.fit_multimodal_transform): that combo fails (no marker) or
# that ablation task fails (no run_token.txt; its summary row reads not run)
# instead of training without its joint PCA under the arm's label. The
# orchestrators' --print_arch check loads no data and cannot see it, so it
# shows up in the combo or ablation job.
# A width pinned for the ablation ALONE is not supported: run_ablation.sh
# refuses an ablation whose architecture signature (the PCA keys included,
# arch_signature.py) differs from its reference combo's config.json, because a
# pinned ablation read against a variance-target reference swaps one capacity
# confound for another. The former ABLATION_POST_PCA_DIM override did exactly
# that; submit_pipeline.sh, run_benchmarking_siamese_vs_others.sh and
# run_ablation.sh now stop if it is set.

# --- Checkpoint retention --------------------------------------------------
# The ablation reports metrics only; no ablated model is ever loaded again.
# train.py has no "don't save" flag (and must not — nonzero-parameter counting
# reloads the checkpoint mid-run), so checkpoints are deleted AFTER
# results.json exists. Set 0 to keep them for debugging.
ABLATION_PURGE_CHECKPOINTS="${ABLATION_PURGE_CHECKPOINTS:-1}"

# Prediction matrices ARE kept: sl_comparison/evaluate_model.py can then score
# an ablated run against the shared folds with the same evaluator as every
# other row in the paper (paper_tables.py --regrade): 5 x 313 MB per run on the
# shared 8,844 genes, about 113 GB for the 72 runs of one PCA arm, about 450 GB
# for all four. Set 1 to remove them.
ABLATION_PURGE_PREDICTIONS="${ABLATION_PURGE_PREDICTIONS:-0}"
