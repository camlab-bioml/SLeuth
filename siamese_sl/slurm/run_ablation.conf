# ============================================================================
# Configuration for the Leave-One-Category-Out Ablation
# ============================================================================
# Sourced by:
#   - submit_pipeline.sh    (to compute the array size)
#   - run_ablation.sh       (array worker — trains one ablated combo)
#   - run_ablation_summary.sh
#
# Shared training hyperparameters come from config.conf, which is sourced
# BEFORE this file. run_best_per_category.conf is also sourced, because the
# ablation must reuse that pipeline's PCA settings verbatim — an ablation
# whose preprocessing differs from the reference combo is not an ablation.
# ============================================================================

# --- What is ablated, and why a CATEGORY rather than an embedding -----------
#
# The combo concatenates exactly one winning embedding per biological
# category (see EMB_CATALOG in run_best_per_category.conf). Dropping a single
# EMBEDDING would only promote that category's runner-up, so the measurement
# would be "how much better is text_embed than bioconceptvec" — a question
# about two files, not about whether literature-derived signal contributes.
#
# Dropping the whole CATEGORY removes that source of biological information
# from the model entirely, which is the claim an ablation table is read as
# making. Each run therefore trains on the remaining 5 categories.
#
# ABLATE_CATEGORIES must match the category labels used in EMB_CATALOG.
ABLATE_CATEGORIES=(expression protein_seq text ppi go kg)

# --- Reference row ---------------------------------------------------------
# The full combo (all categories) is NOT retrained here: run_best_per_category_combo.sh
# already produced it at results/best_cat_<names>_<cv>, and the summary script
# reads that directory as the baseline. Retraining it under a different job
# would introduce a second run of the same configuration and invite the two to
# disagree by run-to-run noise.

# --- Post-concat PCA: a confound to be aware of ----------------------------
# config.conf currently resolves the post-concat PCA to a VARIANCE target
# (POST_PCA_VARIANCE, default 0.8). Dropping a category shrinks the
# concatenated matrix, so the retained component count k — and therefore the
# encoder's input width and parameter count — shrinks with it. A performance
# drop then confounds "this signal was informative" with "the model got
# smaller".
#
# Default: inherit config.conf, so every ablated run is preprocessed exactly
# like the reference combo and the comparison against it is apples-to-apples.
# The resolved k is printed by train.py and captured by the summary script, so
# the confound is visible rather than silent.
#
# To run the capacity-controlled variant instead, pin an exact width:
#   ABLATION_POST_PCA_DIM=145 ./slurm/submit_pipeline.sh --ablation-only
# Both variants are informative; report whichever you describe in the paper.
if [ -n "${ABLATION_POST_PCA_DIM:-}" ]; then
    POST_PCA_DIM="$ABLATION_POST_PCA_DIM"
fi

# --- Checkpoint retention --------------------------------------------------
# The ablation reports metrics only; no ablated model is ever loaded again.
# train.py has no "don't save" flag (and must not — nonzero-parameter counting
# reloads the checkpoint mid-run), so checkpoints are deleted AFTER
# results.json exists. Set 0 to keep them for debugging.
ABLATION_PURGE_CHECKPOINTS="${ABLATION_PURGE_CHECKPOINTS:-1}"

# Prediction matrices ARE kept: sl_comparison/evaluate_model.py can then score
# an ablated run against the shared folds with the same evaluator as every
# other row in the paper.
ABLATION_PURGE_PREDICTIONS="${ABLATION_PURGE_PREDICTIONS:-0}"
